<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>单词筛记 · Vocab Sieve</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-2: #f0f2f5;
      --border: #e2e6ec;
      --text: #18202c;
      --text-muted: #5f6c7b;
      --accent: #1d6f5c;
      --accent-soft: #e6f3ef;
      --accent-hover: #155748;
      --warn: #c26d18;
      --warn-soft: #fdf2e4;
      --danger: #b9382c;
      --danger-soft: #fceceb;
      --info: #2563eb;
      --info-soft: #eaf1fe;
      --shadow: 0 2px 10px rgba(16, 24, 40, 0.06);
      --radius: 10px;
      --chip-bg: #ffffff;
      --chip-border: #d8dee6;
    }

    html.dark {
      --bg: #14171c;
      --surface: #1d2128;
      --surface-2: #252a33;
      --border: #2f3642;
      --text: #e8ecf2;
      --text-muted: #9aa5b5;
      --accent: #3cb393;
      --accent-soft: rgba(60, 179, 147, 0.14);
      --accent-hover: #4ec8a7;
      --warn: #e5993e;
      --warn-soft: rgba(229, 153, 62, 0.14);
      --danger: #e26458;
      --danger-soft: rgba(226, 100, 88, 0.15);
      --info: #60a5fa;
      --info-soft: rgba(96, 165, 250, 0.15);
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      --chip-bg: #222730;
      --chip-border: #353d4b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      overflow: hidden;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Top Header */
    .topbar {
      position: relative;
      z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      flex-wrap: nowrap;
      min-width: 0;
    }
    .book-select-compact {
      min-width: 110px;
      max-width: 195px;
      flex: 0 1 auto;
      font-weight: 600;
      text-overflow: ellipsis;
    }
    .unit-select-compact {
      min-width: 80px;
      max-width: 185px;
      flex: 0 1 185px;
      text-overflow: ellipsis;
    }
    .search-wrap {
      flex-shrink: 0;
    }
    .search-wrap input[type="text"] {
      width: 96px;
      transition: width 0.18s ease, border-color 0.15s;
    }
    .search-wrap input[type="text"]:focus {
      width: 152px;
    }

    select, input[type="text"], textarea {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      outline: none;
      font-family: inherit;
    }
    select:focus, input[type="text"]:focus, textarea:focus {
      border-color: var(--accent);
    }

    .spacer { flex: 1; min-width: 4px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.14s;
      user-select: none;
    }
    .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #fff;
    }
    .btn-warn {
      background: var(--warn-soft);
      border-color: var(--warn);
      color: var(--warn);
    }
    .btn-toggle.is-on {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .btn-sm { padding: 3px 7px; font-size: 11.5px; }

    /* Top Progress Line & Popover Menus */
    .top-progress-line {
      height: 2px;
      width: 100%;
      background: var(--surface-2);
      overflow: hidden;
    }
    .top-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--info));
      transition: width 0.25s ease;
    }
    .top-more-menu, .stage-pop-menu {
      position: relative;
      flex-shrink: 0;
    }
    .top-more-menu > summary, .stage-pop-menu > summary {
      list-style: none;
    }
    .top-more-menu > summary::-webkit-details-marker,
    .stage-pop-menu > summary::-webkit-details-marker {
      display: none;
    }
    .more-popover, .stage-popover {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      width: 288px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
      z-index: 150;
    }
    .stage-popover { width: 268px; }
    .popover-section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .popover-divider {
      height: 1px;
      background: var(--border);
      margin: 8px 0;
    }
    .popover-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .popover-help {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .pop-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .pop-toggles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }

    /* Stats Strip (inside popover) */
    .stats-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }
    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--surface-2);
      padding: 2px 7px;
      border-radius: 99px;
    }
    .stat-pill b { color: var(--text); font-weight: 600; }
    .stat-pill.accent b { color: var(--accent); }
    .stat-pill.warn b { color: var(--warn); }
    .stat-pill.info b { color: var(--info); }

    /* Stage Nav */
    .stage-nav {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 4px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex-shrink: 0;
    }
    .stage-btn {
      flex: 1 1 0;
      justify-content: center;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      padding: 4px 6px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .stage-btn:hover { background: var(--surface-2); color: var(--text); }
    .stage-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(29, 111, 92, 0.25);
    }
    .stage-badge {
      font-size: 10.5px;
      padding: 0 5px;
      border-radius: 99px;
      background: var(--surface-2);
      color: var(--text-muted);
    }
    .stage-btn.active .stage-badge {
      background: var(--accent);
      color: #fff;
    }

    /* Main Content */
    .main-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 14px;
      position: relative;
    }

    .toolbar-inline {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      padding: 6px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .help-tip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 99px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      cursor: help;
      flex-shrink: 0;
    }
    .hint-text { font-size: 11.5px; color: var(--text-muted); }

    /* Word Sieve Wall (Stages 1, 3, 4) */
    .unit-section {
      margin-bottom: 14px;
      content-visibility: auto;
      contain-intrinsic-size: auto 220px;
    }
    .unit-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 4px 2px 6px;
      border-bottom: 1px dashed var(--border);
      margin-bottom: 8px;
    }
    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(126px, 1fr));
      gap: 6px;
    }
    .word-grid.density-ultra {
      grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
      gap: 4px;
    }
    .word-grid.density-relaxed {
      grid-template-columns: repeat(auto-fill, minmax(154px, 1fr));
      gap: 8px;
    }

    .word-chip {
      position: relative;
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
      border-radius: 7px;
      padding: 7px 9px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      transition: transform 0.14s ease, opacity 0.14s ease, border-color 0.12s, background 0.12s;
    }
    .density-ultra .word-chip { padding: 4px 7px; font-size: 12px; border-radius: 5px; }
    .word-chip:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .word-chip.vanishing {
      transform: scale(0.84);
      opacity: 0;
      pointer-events: none;
    }
    .word-chip.is-known {
      opacity: 0.65;
      background: var(--surface-2);
      text-decoration: line-through;
    }
    .word-chip.is-starred {
      border-color: var(--warn);
      background: var(--warn-soft);
    }
    .word-chip.is-demoted {
      border-color: var(--danger);
      background: var(--danger-soft);
    }
    .word-chip.is-cursor {
      outline: 2px solid var(--info);
      outline-offset: 1px;
      box-shadow: 0 0 0 3px var(--info-soft);
    }
    .chip-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chip-icons {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
      font-size: 11px;
      color: var(--text-muted);
    }
    .chip-star { color: var(--warn); }
    .chip-rev-cnt {
      font-size: 10px;
      font-weight: 600;
      padding: 0 3.5px;
      border-radius: 3px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .chip-story-dot {
      font-size: 10px;
      color: var(--info);
    }

    /* Stage 3 Direction Switcher & Zh->En Grid */
    .dir-switch {
      display: inline-flex;
      flex-shrink: 0;
      background: var(--surface-2);
      border-radius: 7px;
      padding: 2px;
      border: 1px solid var(--border);
    }
    .dir-tab {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 2.5px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.14s;
    }
    .dir-tab:hover:not(.active) {
      color: var(--text);
    }
    .dir-tab.active {
      background: var(--accent-soft);
      color: var(--accent);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }
    .word-grid.mode-zh2en {
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 7px;
    }
    .word-grid.mode-zh2en.density-ultra {
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 5px;
    }
    .word-grid.mode-zh2en.density-relaxed {
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 9px;
    }
    .word-grid.mode-zh2en .word-chip {
      align-items: flex-start;
      padding: 8px 10px;
      font-size: 12.5px;
      line-height: 1.42;
    }
    .word-grid.mode-zh2en .chip-label {
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .chip-pos {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0 4px;
      border-radius: 3px;
      margin-right: 4px;
      vertical-align: 0.5px;
    }
    .chip-pos.is-en-fallback {
      color: var(--info);
      background: var(--info-soft);
    }
    .chip-pos.is-empty-fallback {
      color: var(--text-muted);
      background: var(--surface-2);
    }

    /* Peek Tooltip */
    .peek-tooltip {
      position: fixed;
      z-index: 2000;
      max-width: 300px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      pointer-events: none;
      display: none;
      font-size: 12px;
    }
    .peek-tooltip.show { display: block; }
    .peek-word { font-weight: 700; font-size: 13.5px; color: var(--accent); }
    .peek-ipa { font-size: 11.5px; color: var(--text-muted); margin-bottom: 3px; }
    .peek-zh { color: var(--text); white-space: pre-line; }
    .peek-tooltip.is-zh2en-answer .peek-word {
      font-size: 15.5px;
    }
    .peek-root {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
      font-size: 11px;
      color: var(--accent);
      line-height: 1.45;
      white-space: pre-line;
      display: none;
    }

    /* Stage 2: Study Cards */
    .root-banner {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 8px 12px;
      margin: 12px 0 8px;
    }
    .root-banner-title {
      font-weight: 700;
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 2px;
    }
    .root-banner-desc {
      font-size: 12px;
      color: var(--text);
      line-height: 1.5;
    }

    .study-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 14px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      content-visibility: auto;
      contain-intrinsic-size: auto 260px;
    }
    .study-body.is-masked {
      position: relative;
      cursor: pointer;
    }
    .study-body.is-masked .maskable {
      filter: blur(7px);
      opacity: 0.35;
      user-select: none;
      transition: filter 0.16s, opacity 0.16s;
    }
    .study-body.is-masked::after {
      content: "点击展开中文与英文释义（自测模式）";
      position: absolute;
      inset: 10px 0 auto 0;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 6px 12px;
      border-radius: 6px;
      width: fit-content;
      margin: 0 auto;
    }
    .unit-bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 14px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .study-card-head {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .study-word {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .ipa-tag {
      font-size: 12px;
      color: var(--text-muted);
      font-family: "Lucida Sans Unicode", "Arial Unicode MS", sans-serif;
    }
    .respell-tag {
      font-size: 11.5px;
      background: var(--info-soft);
      color: var(--info);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .pos-tag {
      font-size: 11px;
      background: var(--surface-2);
      color: var(--text-muted);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .study-block { margin-top: 8px; }
    .study-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .zh-meaning {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      white-space: pre-line;
    }
    .en-meaning {
      font-size: 13px;
      color: var(--text);
      line-height: 1.55;
    }
    .context-box {
      background: var(--surface-2);
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 12.5px;
      line-height: 1.6;
      color: var(--text);
    }
    .study-root-box {
      background: var(--surface-2);
      border-left: 3px solid var(--accent);
      border-radius: 0 7px 7px 0;
      padding: 8px 12px;
      font-size: 12.5px;
      line-height: 1.55;
    }
    .study-root-breakdown {
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 4px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .study-root-etym {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.5;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .root-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(29, 111, 92, 0.14);
      color: var(--accent);
      flex-shrink: 0;
    }
    .etym-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(140, 100, 40, 0.12);
      color: #936015;
      flex-shrink: 0;
    }
    .hl-word {
      background: rgba(29, 111, 92, 0.16);
      color: var(--accent);
      font-weight: 600;
      padding: 0 2px;
      border-radius: 3px;
    }
    .example-item {
      padding: 5px 8px;
      border-left: 2px solid var(--border);
      margin-bottom: 5px;
      font-size: 12.5px;
    }
    .example-src {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-left: 5px;
    }
    .example-zh {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .cognate-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 4px;
    }
    .cognate-chip {
      font-size: 11.5px;
      padding: 2px 7px;
      border-radius: 99px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      cursor: pointer;
      color: var(--text);
    }
    .cognate-chip:hover { border-color: var(--accent); color: var(--accent); }

    .mnemonic-box {
      width: 100%;
      min-height: 44px;
      resize: vertical;
      margin-top: 4px;
    }

    /* Focus Card Nav */
    .focus-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    /* Stage 5: Listening Mode */
    .listen-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 16px;
      text-align: center;
      box-shadow: var(--shadow);
      margin-bottom: 12px;
    }
    .listen-word-display {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      min-height: 44px;
      margin: 10px 0 4px;
    }
    .listen-sub-display {
      font-size: 13px;
      color: var(--text-muted);
      min-height: 24px;
      margin-bottom: 12px;
    }
    .progress-track {
      width: 100%;
      max-width: 440px;
      height: 8px;
      background: var(--surface-2);
      border-radius: 99px;
      overflow: hidden;
      margin: 0 auto 14px;
    }
    .progress-fill {
      height: 100%;
      width: 100%;
      background: var(--accent);
      transition: width 0.08s linear;
    }
    .progress-fill.urgent { background: var(--warn); }
    .listen-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .tray-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media (min-width: 720px) {
      .tray-grid { grid-template-columns: 1.4fr 1fr; }
    }
    .tray-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
    }
    .tray-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .missed-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      background: var(--danger-soft);
      margin-bottom: 5px;
      font-size: 12px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.show { display: flex; }
    .modal-card {
      width: 100%;
      max-width: 580px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.28);
    }
    .modal-card.modal-wide {
      max-width: 780px;
      padding: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #detail-modal { z-index: 3100; }

    /* Story Modal & Anchors */
    .story-anchor-box {
      background: var(--info-soft);
      border-left: 3px solid var(--info);
      border-radius: 0 7px 7px 0;
      padding: 8px 12px;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--text);
    }
    .story-anchor-line { margin-bottom: 3px; }
    .story-sentence-line { color: var(--text-muted); font-size: 12px; }
    .story-modal-head {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .story-select {
      max-width: 240px;
      font-weight: 600;
    }
    .story-modal-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px 18px;
    }
    .story-act-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      margin: 14px 0 8px;
      padding-bottom: 4px;
      border-bottom: 1px dashed var(--border);
    }
    .story-act-title:first-child { margin-top: 0; }
    .story-p {
      font-size: 14px;
      line-height: 1.85;
      margin-bottom: 10px;
      color: var(--text);
    }
    .story-p.is-tip {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .story-hr {
      border: none;
      border-top: 1px dashed var(--border);
      margin: 14px 0;
    }
    .story-word-token {
      display: inline;
      padding: 1px 5px;
      margin: 0 1px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
    }
    .story-word-token:hover, .story-word-token.is-active {
      background: var(--accent);
      color: #fff;
    }
    .story-word-token .story-zh {
      font-weight: 500;
      font-size: 12.5px;
      color: var(--text-muted);
    }
    .story-word-token:hover .story-zh,
    .story-word-token.is-active .story-zh {
      color: rgba(255, 255, 255, 0.92);
    }
    .story-word-token .story-blank { display: none; }
    .story-reader.mode-hide_zh .story-word-token:not(.is-revealed) .story-zh {
      display: none;
    }
    .story-reader.mode-cloze .story-word-token:not(.is-revealed) .story-en {
      display: none;
    }
    .story-reader.mode-cloze .story-word-token:not(.is-revealed) .story-blank {
      display: inline;
      letter-spacing: 0.5px;
    }
    .story-table-wrap {
      margin: 8px 0 14px;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .story-table-wrap.is-hidden { display: none; }
    .story-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .story-table th, .story-table td {
      padding: 6px 9px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: top;
    }
    .story-table th {
      background: var(--surface-2);
      color: var(--text-muted);
      font-weight: 700;
    }
    .story-table tr:last-child td { border-bottom: none; }
    .story-table-word {
      font-weight: 700;
      color: var(--accent);
      cursor: pointer;
      white-space: nowrap;
    }
    .story-table-word:hover { text-decoration: underline; }
    .story-modal-foot {
      border-top: 1px solid var(--border);
      background: var(--surface-2);
      padding: 9px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .story-anchor-preview {
      flex: 1;
      min-width: 220px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--text);
    }
    .story-editor-grid {
      display: grid;
      grid-template-columns: 1fr 120px 120px;
      gap: 8px;
      margin-bottom: 10px;
    }
    .story-editor-md {
      width: 100%;
      min-height: 300px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      line-height: 1.55;
    }
    .empty-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 4000;
      background: #1f2937;
      color: #fff;
      padding: 7px 12px;
      border-radius: 7px;
      font-size: 12px;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>
<div class="app-shell">
  <!-- Header -->
  <header class="topbar">
    <div class="topbar-row">
      <select id="book-select" class="book-select-compact" title="切换当前挂载词书（一次仅挂载一本）"></select>
      <select id="unit-select" class="unit-select-compact" title="选择单元/章节"></select>
      <div class="spacer"></div>
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="搜索..." />
      </div>
      <button class="btn btn-sm" id="btn-undo" title="撤销上一步 (Cmd+Z)" disabled>↶ 撤销</button>
      <a class="btn btn-sm" id="btn-open-stats" href="stats.html" title="打开每日学习统计曲线面板" style="text-decoration:none;">统计</a>
      <button class="btn btn-sm" id="btn-reload" onclick="window.location.reload()" title="刷新面板">↻</button>
      <details class="top-more-menu" id="top-more-menu">
        <summary class="btn btn-sm" title="统计明细、导出与外观设置">
          <span id="stat-mini-text">0%</span>
          <span style="opacity:0.55;">·</span>
          <span>⋯</span>
        </summary>
        <div class="more-popover">
          <div class="popover-section-title">当前范围进度统计</div>
          <div class="stats-strip" id="stats-strip"></div>
          <div class="popover-divider"></div>
          <div class="popover-actions">
            <button class="btn btn-sm" id="btn-export-md" title="复制当前待攻克与星标词表为 Markdown">导出 Markdown 词表</button>
            <button class="btn btn-sm" id="btn-theme" title="切换深浅色">切换深浅色主题</button>
          </div>
          <div class="popover-divider"></div>
          <div class="popover-help">
            <div><b>筛词快捷键：</b><code>←/→/↑/↓</code> 或 <code>HJKL</code> 移游标 · <code>Space</code> 筛除 · <code>S</code> 星标/打回 · <code>V</code> 发音释义 · <code>双击</code> 详情</div>
          </div>
        </div>
      </details>
    </div>
    <div class="top-progress-line"><div class="top-progress-fill" id="top-progress-fill"></div></div>
  </header>

  <!-- 5-Stage Navigation -->
  <nav class="stage-nav" id="stage-nav">
    <button class="stage-btn" data-stage="triage">① 初筛 <span class="stage-badge" id="badge-triage">0</span></button>
    <button class="stage-btn" data-stage="study">② 精学 <span class="stage-badge" id="badge-study">0</span></button>
    <button class="stage-btn" data-stage="sieve2">③ 二筛 <span class="stage-badge" id="badge-sieve2">0</span></button>
    <button class="stage-btn" data-stage="review">④ 复习 <span class="stage-badge" id="badge-review">0</span></button>
    <button class="stage-btn" data-stage="listen">⑤ 听词 <span class="stage-badge" id="badge-listen">0</span></button>
  </nav>

  <!-- Main Workspace -->
  <main class="main-area" id="main-area"></main>
</div>

<!-- Hover Peek Tooltip -->
<div class="peek-tooltip" id="peek-tooltip">
  <div class="peek-word" id="peek-word"></div>
  <div class="peek-ipa" id="peek-ipa"></div>
  <div class="peek-zh" id="peek-zh"></div>
  <div class="peek-root" id="peek-root"></div>
</div>

<!-- Word Detail Modal -->
<div class="modal-backdrop" id="detail-modal">
  <div class="modal-card" id="detail-modal-body"></div>
</div>

<!-- Story Modal -->

  <div class="modal-card modal-wide" id="story-modal-body"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function() {
  // 1. Theme Sync (Antigravity sidecar + local toggle)
  const savedTheme = localStorage.getItem('vocab_sieve_theme');
  if (savedTheme === 'dark') document.documentElement.classList.add('dark');
  window.addEventListener('message', (ev) => {
    if (ev.data && ev.data.type === 'theme') {
      const isDark = ev.data.theme === 'dark' || (ev.data.vars && String(ev.data.vars['--background'] || '').startsWith('#1'));
      if (!localStorage.getItem('vocab_sieve_theme')) {
        document.documentElement.classList.toggle('dark', isDark);
      }
    }
  });

  // 2. Tokenized API helper
  const urlParams = new URLSearchParams(window.location.search);
  const sidecarToken = urlParams.get('token') || window.__SIDECAR_TOKEN__ || '';
  function withToken(url) {
    if (!sidecarToken) return url;
    return url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(sidecarToken);
  }
  const openStatsLink = document.getElementById('btn-open-stats');
  if (openStatsLink) {
    openStatsLink.setAttribute('href', withToken('stats.html'));
  }
  async function apiFetch(url, options = {}) {
    const headers = new Headers(options.headers || {});
    headers.set('Content-Type', 'application/json');
    if (sidecarToken) headers.set('X-Sidecar-Token', sidecarToken);
    const resp = await fetch(withToken(url), { ...options, headers });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return resp.json();
  }

  // 3. Global App State
  const state = {
    manifest: window.__INITIAL_MANIFEST__ || { books: [] },
    progress: window.__INITIAL_PROGRESS__ || { settings: {}, words: {} },
    stories: window.__INITIAL_STORIES__ || { version: 1, stories: [] },
    storyEntriesByWord: new Map(),
    booksCache: {},
    activeBookId: 'mwvb',
    activeStage: 'triage',
    activeUnit: 'ALL',
    searchQuery: '',
    // View options
    density: 'compact', // ultra | compact | relaxed
    groupByUnit: true,
    triageShowKnown: false,
    studyShowAll: false,
    studyMask: false,
    studyMode: 'list', // list | focus
    focusIndex: 0,
    focusReveal: true,
    sieve2Peek: true,
    sieve2Direction: 'en2zh', // 'en2zh' (看英回中) | 'zh2en' (看中回英)
    sieve2Order: null, // shuffled ids
    reviewDirection: 'en2zh', // 'en2zh' (看英回中) | 'zh2en' (看中回英)
    reviewSource: 'stage3_due', // stage3_due | stage3 | hard | story | triage | all_mastered | random80
    reviewFilterStoryId: null,
    reviewOrder: null,
    reviewDemoteClick: false,
    reviewClearedIds: new Set(),
    activeStoryModalId: null,
    storyReadMode: 'hide_zh', // 'full' | 'hide_zh' | 'cloze'
    storyShowTable: false,
    storyEditing: false,
    storyEditIsNew: false,
    storyRevealedWords: new Set(),
    storyActiveWordKey: '',
    cursorWid: null,
    // Undo stack (up to 50)
    undoStack: [],
    // Listening mode state
    listen: {
      scope: 'learning', // learning | unit_all | stage3 | hard | random50
      intervalSec: 2.0,
      repeat: 1,
      voice: 'Samantha',
      blind: true,
      flashOnMiss: true,
      replayOnMiss: true,
      soundFx: true,
      running: false,
      paused: false,
      queue: [],
      index: 0,
      passed: [],
      missed: [],
      awaitingAction: false,
      timerHandle: null,
      tickHandle: null,
      countdownStart: 0,
      flashingMiss: false,
      currentAudio: null
    }
  };

  // Restore saved settings
  const s = state.progress.settings || {};
  if (s.activeBook) state.activeBookId = s.activeBook;
  if (s.activeStage) state.activeStage = s.activeStage;
  if (s.activeUnit) state.activeUnit = s.activeUnit;
  if (s.density) state.density = s.density;
  if (s.sieve2Direction === 'en2zh' || s.sieve2Direction === 'zh2en') {
    state.sieve2Direction = s.sieve2Direction;
  }
  if (s.reviewDirection === 'en2zh' || s.reviewDirection === 'zh2en') {
    state.reviewDirection = s.reviewDirection;
  }
  if (s.listenIntervalSec) state.listen.intervalSec = Number(s.listenIntervalSec);
  if (s.listenRepeat) state.listen.repeat = Number(s.listenRepeat);
  if (s.listenVoice) state.listen.voice = s.listenVoice;
  if (typeof s.listenBlind === 'boolean') state.listen.blind = s.listenBlind;
  if (typeof s.listenFlashOnMiss === 'boolean') state.listen.flashOnMiss = s.listenFlashOnMiss;
  if (typeof s.listenReplayOnMiss === 'boolean') state.listen.replayOnMiss = s.listenReplayOnMiss;
  if (typeof s.listenSoundFx === 'boolean') state.listen.soundFx = s.listenSoundFx;

  // 4. Persistence & Undo
  let pendingWordPatches = {};
  let saveTimer = null;
  let toastTimer = null;

  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2100);
  }

  function scheduleSave(immediate = false) {
    clearTimeout(saveTimer);
    const flush = async () => {
      const patches = pendingWordPatches;
      pendingWordPatches = {};
      try {
        await apiFetch('/api/progress', {
          method: 'POST',
          body: JSON.stringify({
            settings: {
              activeBook: state.activeBookId,
              activeStage: state.activeStage,
              activeUnit: state.activeUnit,
              density: state.density,
              sieve2Direction: state.sieve2Direction,
              reviewDirection: state.reviewDirection,
              listenIntervalSec: state.listen.intervalSec,
              listenRepeat: state.listen.repeat,
              listenVoice: state.listen.voice,
              listenBlind: state.listen.blind,
              listenFlashOnMiss: state.listen.flashOnMiss,
              listenReplayOnMiss: state.listen.replayOnMiss,
              listenSoundFx: state.listen.soundFx
            },
            words: patches
          })
        });
      } catch (e) {
        console.warn('保存进度失败:', e);
      }
    };
    if (immediate) flush();
    else saveTimer = setTimeout(flush, 350);
  }

  function getWordRec(wordId) {
    return state.progress.words[wordId] || {};
  }

  function updateWordRec(wordId, patch, recordUndo = true) {
    const prev = state.progress.words[wordId] ? { ...state.progress.words[wordId] } : null;
    if (recordUndo) {
      state.undoStack.push({ wordId, prev });
      if (state.undoStack.length > 50) state.undoStack.shift();
      document.getElementById('btn-undo').disabled = state.undoStack.length === 0;
    }
    const next = { ...(prev || {}), ...patch, updatedAt: new Date().toISOString() };
    state.progress.words[wordId] = next;
    pendingWordPatches[wordId] = next;
    scheduleSave();
    renderHeaderStats();
  }

  function performUndo() {
    if (state.undoStack.length === 0) return;
    const { wordId, prev } = state.undoStack.pop();
    if (prev === null) {
      delete state.progress.words[wordId];
      pendingWordPatches[wordId] = {};
    } else {
      state.progress.words[wordId] = prev;
      pendingWordPatches[wordId] = prev;
    }
    document.getElementById('btn-undo').disabled = state.undoStack.length === 0;
    scheduleSave();
    renderAll();
    showToast('已撤销上一步操作');
  }

  // 5. Audio Pronunciation & Lookahead Pre-fetching + WebAudio Earcons
  let activeAudioEl = null;
  let audioCtx = null;
  const audioBlobCache = new Map(); // cacheKey -> objectURL
  const inflightTts = new Map();    // cacheKey -> Promise<string|null>

  function playFeedbackTone(kind) {
    if (!state.listen.soundFx) return;
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const playNote = (freq, start, dur, type = 'sine', gainVal = 0.08) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(gainVal, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + dur);
      };
      if (kind === 'pass') {
        playNote(660, now, 0.08, 'sine', 0.07);
        playNote(880, now + 0.06, 0.11, 'sine', 0.07);
      } else {
        playNote(240, now, 0.14, 'triangle', 0.06);
      }
    } catch (_) {}
  }

  function stopAudio() {
    if (activeAudioEl) {
      activeAudioEl.pause();
      activeAudioEl = null;
    }
    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
    }
  }

  function speakWebSpeech(text, voiceName) {
    return new Promise((resolve) => {
      if (!window.speechSynthesis) { resolve(); return; }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = voiceName === 'Daniel' ? 'en-GB' : 'en-US';
      u.rate = 0.95;
      u.onend = () => resolve();
      u.onerror = () => resolve();
      window.speechSynthesis.speak(u);
    });
  }

  async function fetchTtsObjectUrl(text, voice = state.listen.voice) {
    const clean = String(text || '').replace(/\([^)]*\)/g, '').trim();
    if (!clean || voice === 'WEB') return null;
    const key = `${voice}|${clean}`;
    if (audioBlobCache.has(key)) return audioBlobCache.get(key);
    if (inflightTts.has(key)) return inflightTts.get(key);

    const p = (async () => {
      try {
        const res = await apiFetch('/api/tts', {
          method: 'POST',
          body: JSON.stringify({ text: clean, voice, rate: 175 })
        });
        if (res && res.status === 'ok' && res.audioBase64) {
          const bin = atob(res.audioBase64);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          const url = URL.createObjectURL(new Blob([bytes], { type: res.mimeType || 'audio/mpeg' }));
          if (audioBlobCache.size >= 150) {
            const oldKey = audioBlobCache.keys().next().value;
            URL.revokeObjectURL(audioBlobCache.get(oldKey));
            audioBlobCache.delete(oldKey);
          }
          audioBlobCache.set(key, url);
          return url;
        }
      } catch (_) {}
      return null;
    })();
    inflightTts.set(key, p);
    try {
      return await p;
    } finally {
      inflightTts.delete(key);
    }
  }

  function prefetchUpcomingAudio(words, startIdx, count = 3, voice = state.listen.voice) {
    if (!words || voice === 'WEB') return;
    for (let i = 0; i < count; i++) {
      const w = words[startIdx + i];
      if (w) fetchTtsObjectUrl(w.cleanWord || w.word, voice);
    }
  }

  async function playTextAudio(text, voice = state.listen.voice, repeat = 1) {
    stopAudio();
    const clean = String(text || '').replace(/\([^)]*\)/g, '').trim();
    if (!clean) return;
    if (voice === 'WEB') {
      for (let i = 0; i < repeat; i++) {
        await speakWebSpeech(clean, 'Samantha');
      }
      return;
    }
    const blobUrl = await fetchTtsObjectUrl(clean, voice);
    if (blobUrl) {
      for (let i = 0; i < repeat; i++) {
        await new Promise((resolve) => {
          const audio = new Audio(blobUrl);
          activeAudioEl = audio;
          audio.onended = resolve;
          audio.onerror = resolve;
          audio.play().catch(resolve);
        });
      }
      return;
    }
    for (let i = 0; i < repeat; i++) {
      await speakWebSpeech(clean, voice);
    }
  }

  // 6. Book Loading & O(1) Hash Indexing (Single-Book Mount)
  async function ensureBookLoaded(bookId) {
    if (state.booksCache[bookId]) return state.booksCache[bookId];
    const data = await apiFetch(`/api/book?id=${encodeURIComponent(bookId)}`);
    const wordMap = new Map();
    const wordLowerMap = new Map();
    for (const w of data.words || []) {
      wordMap.set(w.id, w);
      wordLowerMap.set(w.word.toLowerCase(), w);
      if (w.cleanWord && !wordLowerMap.has(w.cleanWord)) {
        wordLowerMap.set(w.cleanWord, w);
      }
    }
    data.wordMap = wordMap;
    data.wordLowerMap = wordLowerMap;
    // Unmount previous book so browser keeps only the active book in memory
    state.booksCache = {};
    state.booksCache[bookId] = data;
    return data;
  }

  function getActiveBook() {
    return state.booksCache[state.activeBookId] || null;
  }

  function getScopedWords() {
    const book = getActiveBook();
    if (!book) return [];
    let list = book.words || [];
    if (state.activeUnit !== 'ALL') {
      list = list.filter((w) => w.unit === state.activeUnit);
    }
    const q = state.searchQuery.trim().toLowerCase();
    if (q) {
      list = list.filter(
        (w) =>
          w.word.toLowerCase().includes(q) ||
          (w.zhMeaning || '').toLowerCase().includes(q) ||
          (w.enMeaning || '').toLowerCase().includes(q) ||
          (w.rootGroup || '').toLowerCase().includes(q) ||
          (w.rootBreakdown || '').toLowerCase().includes(q) ||
          (w.etymology || '').toLowerCase().includes(q)
      );
    }
    return list;
  }

  function isKnown(w) {
    const r = getWordRec(w.id);
    return r.status === 'known';
  }
  function isMastered(w) {
    const r = getWordRec(w.id);
    return r.status === 'mastered';
  }
  function isLearningPool(w) {
    const r = getWordRec(w.id);
    return r.status !== 'known' && r.status !== 'mastered';
  }

  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function escHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function highlightWordInText(text, cleanWord) {
    const escaped = escHtml(text);
    if (!cleanWord || cleanWord.length < 3) return escaped;
    const re = new RegExp(`\\b(${cleanWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\w*)\\b`, 'gi');
    return escaped.replace(re, '<span class="hl-word">$1</span>');
  }

  const POS_ABBR_MAP = {
    'noun': 'n.',
    'plural noun': 'n.',
    'proper noun': 'n.',
    'adjective': 'adj.',
    'adjective,': 'adj.',
    'adverb': 'adv.',
    'transitive verb': 'vt.',
    'intransitive verb': 'vi.',
    'transitive or intransitive verb': 'v.',
    'intransitive or transitive verb': 'v.',
    'reflexive verb': 'v.',
    'preposition': 'prep.',
    'abbreviation': 'abbr.',
    'exclamation': 'excl.',
    'combining form': 'comb.'
  };

  function maskTargetWord(text, cleanWord) {
    const stem = String(cleanWord || '').trim();
    if (!stem || stem.length < 3) return text;
    const escaped = stem.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(`\\b${escaped}\\w*\\b`, 'gi');
    return String(text || '').replace(re, '___');
  }

  function formatZhPromptForChip(w) {
    const zhRaw = (w.zhMeaning || '').trim();
    const enRaw = (w.enMeaning || '').trim();
    const cleanWord = (w.cleanWord || w.word || '').trim();

    if (zhRaw.includes('[WPME 同族派生]')) {
      const m = zhRaw.match(/\(([^)]+)\)/);
      const roleZh = m ? m[1].trim() : '';
      let enClean = enRaw
        .replace(/^\[[^\]]+\]\s*/, '')
        .replace(/related to\s+[A-Za-z\-']+:\s*/i, '');
      enClean = maskTargetWord(enClean, cleanWord).trim();
      return {
        pos: roleZh || '派生',
        text: enClean || roleZh || '同族派生词',
        kind: enClean ? 'en' : 'zh'
      };
    }

    if (zhRaw) {
      let posTag = '';
      const mPos = zhRaw.match(/^\[([^\]]+)\]\s*/);
      if (mPos) {
        posTag = POS_ABBR_MAP[mPos[1].trim().toLowerCase()] || '';
      }

      const lines = zhRaw.split('\n').map((l) => l.trim()).filter(Boolean);
      const cleanedLines = [];
      lines.forEach((origLine, idx) => {
        let ln = origLine;
        if (idx === 0 && posTag) {
          ln = ln.replace(/^\[[^\]]+\]\s*/, '');
        }
        ln = ln.replace(/（派生自\s+[^:：]+[:：]\s*(?:\[[^\]]+\]\s*)?/g, '（');
        ln = ln.replace(/\[([^\]]+)\]\s*/g, (_, tag) => {
          const short = POS_ABBR_MAP[tag.trim().toLowerCase()] || '';
          return short ? `${short} ` : '';
        });
        for (let pass = 0; pass < 3; pass++) {
          const next = ln.replace(/\([A-Za-z\u00C0-\u00FF0-9\s,;:'"’‘./\-&?!+_]+\)\s*/g, '');
          if (next === ln) break;
          ln = next;
        }
        ln = ln
          .replace(/\s*\/\s*/g, ' / ')
          .replace(/(?:\s*\/\s*){2,}/g, ' / ')
          .replace(/^\s*\/\s*|\s*\/\s*$/g, '')
          .replace(/\s+/g, ' ')
          .trim();
        if (ln) cleanedLines.push(ln);
      });

      const joined = maskTargetWord(cleanedLines.join('；'), cleanWord).trim();
      if (joined) {
        return { pos: posTag, text: joined, kind: 'zh' };
      }
    }

    if (enRaw) {
      const text = maskTargetWord(enRaw, cleanWord).trim();
      const mappedPos = POS_ABBR_MAP[(w.pos || '').trim().toLowerCase()];
      return { pos: mappedPos || 'EN', text, kind: 'en' };
    }

    return { pos: '无释义', text: w.word, kind: 'empty' };
  }

  // 6.5 Contextual Stories Parser, Indexer & Modal Reader
  function stripSimpleMd(text) {
    return String(text || '')
      .replace(/\*\*(.*?)\*\*/g, '$1')
      .replace(/\*(.*?)\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .trim();
  }

  function formatInlineMdHtml(text) {
    return escHtml(text)
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/\*(.+?)\*/g, '<i>$1</i>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  function extractWordsFromMarkdown(md) {
    const found = [];
    const seen = new Set();
    const re = /\*\*([A-Za-z][A-Za-z\-']*)\*\*/g;
    let m;
    while ((m = re.exec(String(md || ''))) !== null) {
      const k = m[1].trim().toLowerCase();
      if (k && !seen.has(k)) {
        seen.add(k);
        found.push(k);
      }
    }
    return found;
  }

  function splitSentencesForStory(line) {
    const parts = String(line || '').match(/[^。！？!?]+[。！？!?]?/g);
    return parts ? parts.map((x) => x.trim()).filter(Boolean) : [];
  }

  function cleanStorySentence(rawSentence) {
    return String(rawSentence || '')
      .replace(/\*\*([A-Za-z][A-Za-z\-']*)\*\*(?:\s*[（(][^）)]+[）)])?/g, ' $1 ')
      .replace(/\*\*(.*?)\*\*/g, '$1')
      .replace(/\s{2,}/g, ' ')
      .replace(/\s+([，。！？；：、”’）])/g, '$1')
      .replace(/([“‘（])\s+/g, '$1')
      .trim();
  }

  function parseStoryMarkdown(md) {
    const lines = String(md || '').split(/\r?\n/);
    const blocks = [];
    const tableWords = new Map();
    const proseWords = new Map();
    let i = 0;

    while (i < lines.length) {
      const rawLine = lines[i];
      const trimmed = rawLine.trim();
      if (!trimmed) {
        i++;
        continue;
      }
      if (/^---+$/.test(trimmed)) {
        blocks.push({ type: 'hr' });
        i++;
        continue;
      }
      const hMatch = trimmed.match(/^#{1,4}\s+(.+)$/);
      if (hMatch) {
        blocks.push({ type: 'heading', text: hMatch[1].trim() });
        i++;
        continue;
      }
      if (trimmed.startsWith('|') && trimmed.includes('|', 1)) {
        const tableLines = [];
        while (i < lines.length && lines[i].trim().startsWith('|')) {
          tableLines.push(lines[i].trim());
          i++;
        }
        const parsedRows = [];
        let headers = [];
        tableLines.forEach((tl, rIdx) => {
          if (/^\|[\s:-]+(?:\|[\s:-]+)+\|?$/.test(tl)) return;
          const cells = tl.replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
          if (!cells.length) return;
          if (!headers.length && rIdx === 0) {
            headers = cells;
          } else {
            parsedRows.push(cells);
            const rawWord = stripSimpleMd(cells[0] || '');
            if (/^[A-Za-z][A-Za-z\-']*$/.test(rawWord)) {
              tableWords.set(rawWord.toLowerCase(), {
                word: rawWord,
                meaning: stripSimpleMd(cells[1] || ''),
                anchor: cells[2] || ''
              });
            }
          }
        });
        blocks.push({ type: 'table', headers, rows: parsedRows });
        continue;
      }

      blocks.push({ type: 'paragraph', text: trimmed });
      const sentences = splitSentencesForStory(trimmed);
      for (const sent of sentences) {
        const cleanSent = cleanStorySentence(sent);
        const re = /\*\*([A-Za-z][A-Za-z\-']*)\*\*(?:\s*[（(]([^）)]+)[）)])?/g;
        let m;
        while ((m = re.exec(sent)) !== null) {
          const wKey = m[1].trim().toLowerCase();
          if (!proseWords.has(wKey)) {
            proseWords.set(wKey, {
              word: m[1].trim(),
              inlineMeaning: (m[2] || '').trim(),
              sentence: cleanSent
            });
          }
        }
      }
      i++;
    }

    return { blocks, tableWords, proseWords };
  }

  function rebuildStoryIndex() {
    state.storyEntriesByWord = new Map();
    const stories = (state.stories && Array.isArray(state.stories.stories)) ? state.stories.stories : [];
    for (const st of stories) {
      const parsed = parseStoryMarkdown(st.markdown || '');
      st._parsed = parsed;
      if (!Array.isArray(st.words) || !st.words.length) {
        st.words = extractWordsFromMarkdown(st.markdown || '');
      }
      const allKeys = new Set([
        ...st.words.map((x) => String(x).toLowerCase()),
        ...parsed.tableWords.keys(),
        ...parsed.proseWords.keys()
      ]);
      for (const key of allKeys) {
        const tInfo = parsed.tableWords.get(key) || {};
        const pInfo = parsed.proseWords.get(key) || {};
        const entry = {
          storyId: st.id,
          storyTitle: st.title || st.id,
          book: st.book || '',
          unit: st.unit || '',
          word: pInfo.word || tInfo.word || key,
          meaning: tInfo.meaning || pInfo.inlineMeaning || '',
          anchor: tInfo.anchor || '',
          sentence: pInfo.sentence || ''
        };
        if (!state.storyEntriesByWord.has(key)) {
          state.storyEntriesByWord.set(key, []);
        }
        state.storyEntriesByWord.get(key).push(entry);
      }
    }
  }

  function getStoryEntryForWord(wordStr) {
    const key = String(wordStr || '').trim().toLowerCase();
    if (!key) return null;
    const entries = state.storyEntriesByWord.get(key);
    if (!entries || !entries.length) return null;
    const exactUnit = entries.find(
      (e) => (!e.book || e.book === state.activeBookId) && (state.activeUnit === 'ALL' || !e.unit || e.unit === state.activeUnit)
    );
    if (exactUnit) return exactUnit;
    const sameBook = entries.find((e) => !e.book || e.book === state.activeBookId);
    return sameBook || entries[0];
  }

  function getStoriesForActiveBook() {
    const stories = (state.stories && Array.isArray(state.stories.stories)) ? state.stories.stories : [];
    return stories.filter((st) => !st.book || st.book === state.activeBookId);
  }

  function getStoriesForCurrentScope() {
    return getStoriesForActiveBook().filter(
      (st) => state.activeUnit === 'ALL' || !st.unit || st.unit === state.activeUnit
    );
  }

  function getActiveStoryWordSet() {
    const stories = (state.stories && Array.isArray(state.stories.stories)) ? state.stories.stories : [];
    if (state.reviewFilterStoryId) {
      const target = stories.find((st) => st.id === state.reviewFilterStoryId);
      if (target) {
        return new Set((target.words || []).map((w) => String(w).toLowerCase()));
      }
    }
    const scopedStories = getStoriesForCurrentScope();
    const list = scopedStories.length ? scopedStories : getStoriesForActiveBook();
    const set = new Set();
    for (const st of list) {
      for (const w of st.words || []) set.add(String(w).toLowerCase());
    }
    return set;
  }

  function renderStoryParagraphHtml(text, tableWords) {
    const isTip = text.startsWith('复习时可以直接') || text.startsWith('需要我用');
    let out = '';
    let lastIdx = 0;
    const re = /\*\*([A-Za-z][A-Za-z\-']*)\*\*(?:\s*([（(]([^）)]+)[）)]))?/g;
    let m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > lastIdx) {
        out += formatInlineMdHtml(text.slice(lastIdx, m.index));
      }
      const rawWord = m[1].trim();
      const key = rawWord.toLowerCase();
      const inlineMeaning = (m[3] || '').trim();
      const tInfo = tableWords.get(key);
      const meaning = inlineMeaning || (tInfo && tInfo.meaning) || '';
      const isRev = state.storyRevealedWords.has(key);
      const isAct = state.storyActiveWordKey === key;
      out += `<span class="story-word-token${isRev ? ' is-revealed' : ''}${isAct ? ' is-active' : ''}" data-story-word="${escHtml(key)}" data-story-raw="${escHtml(rawWord)}" title="点击发音并查看锚点 · 双击看词卡详情"><span class="story-en">${escHtml(rawWord)}</span><span class="story-blank">[ ___ ]</span>${meaning ? `<span class="story-zh">（${escHtml(meaning)}）</span>` : ''}</span>`;
      lastIdx = re.lastIndex;
    }
    if (lastIdx < text.length) {
      out += formatInlineMdHtml(text.slice(lastIdx));
    }
    return `<p class="story-p${isTip ? ' is-tip' : ''}">${out}</p>`;
  }

  function renderStoryAnchorPreviewHtml(st) {
    const key = state.storyActiveWordKey;
    if (!key) {
      return `<span class="hint-text">点击文中高亮词可发音并显示释义与记忆锚点 · 双击可打开完整词卡</span>`;
    }
    const parsed = (st && st._parsed) || parseStoryMarkdown((st && st.markdown) || '');
    const tInfo = parsed.tableWords.get(key) || {};
    const pInfo = parsed.proseWords.get(key) || {};
    const displayWord = pInfo.word || tInfo.word || key;
    const meaning = tInfo.meaning || pInfo.inlineMeaning || '';
    const anchor = tInfo.anchor || '';
    const book = getActiveBook();
    const match = book && book.wordLowerMap ? book.wordLowerMap.get(key) : null;
    return `
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
        <b style="color:var(--accent);font-size:13px;">${escHtml(displayWord)}</b>
        ${meaning ? `<span>${escHtml(meaning)}</span>` : ''}
        <button class="btn btn-sm" style="padding:1px 6px;" data-speak="${escHtml(displayWord)}">🔊</button>
        ${match ? `<button class="btn btn-sm" style="padding:1px 6px;" data-open-detail="${escHtml(match.id)}">词卡详情</button>` : ''}
      </div>
      ${anchor ? `<div class="hint-text" style="margin-top:2px;">🧩 ${formatInlineMdHtml(anchor)}</div>` : ''}
    `;
  }

  function renderStoryModal() {
    const modal = document.getElementById('story-modal');
    const body = document.getElementById('story-modal-body');
    if (!modal || !body) return;

    const allStories = (state.stories && Array.isArray(state.stories.stories)) ? state.stories.stories : [];
    const activeStory = allStories.find((st) => st.id === state.activeStoryModalId) || allStories[0] || null;
    if (activeStory && state.activeStoryModalId !== activeStory.id) {
      state.activeStoryModalId = activeStory.id;
    }

    if (state.storyEditing || !activeStory) {
      const target = state.storyEditIsNew ? null : activeStory;
      const defaultBook = (target && target.book) || state.activeBookId || '';
      const defaultUnit = (target && target.unit) || (state.activeUnit === 'ALL' ? '' : state.activeUnit);
      body.innerHTML = `
        <div class="story-modal-head">
          <b>${target ? '✎ 编辑情景故事' : '+ 新建 / 粘贴情景故事'}</b>
          <div class="spacer"></div>
          ${allStories.length ? `<button class="btn btn-sm" id="btn-story-edit-cancel">返回阅读</button>` : ''}
          <button class="btn btn-sm" id="btn-close-story">关闭 (Esc)</button>
        </div>
        <div class="story-modal-scroll">
          <div class="story-editor-grid">
            <input type="text" id="story-ed-title" placeholder="故事标题，例如：Ch 1 顽固 38 词三幕剧" value="${escHtml((target && target.title) || '')}" />
            <input type="text" id="story-ed-book" placeholder="词书 ID (如 wpme)" value="${escHtml(defaultBook)}" />
            <input type="text" id="story-ed-unit" placeholder="单元 (如 Ch 1，可空)" value="${escHtml(defaultUnit)}" />
          </div>
          <textarea class="story-editor-md" id="story-ed-md" placeholder="直接粘贴 AI 生成的 Markdown 情景故事，正文用 **单词**（中文释义） 标注词汇，可附 Markdown 词根锚点表...">${escHtml((target && target.markdown) || '')}</textarea>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px;flex-wrap:wrap;">
            <span class="hint-text" id="story-ed-count">已识别 **加粗词汇** 0 个</span>
            <div style="display:flex;gap:6px;">
              ${target ? `<button class="btn btn-sm btn-warn" id="btn-story-delete">删除故事</button>` : ''}
              <button class="btn btn-sm btn-primary" id="btn-story-save">保存故事</button>
            </div>
          </div>
        </div>
      `;

      const mdEl = document.getElementById('story-ed-md');
      const cntEl = document.getElementById('story-ed-count');
      const refreshDetectCount = () => {
        const words = extractWordsFromMarkdown(mdEl.value);
        cntEl.textContent = `已识别 **加粗词汇** ${words.length} 个`;
      };
      refreshDetectCount();
      mdEl.addEventListener('input', refreshDetectCount);

      document.getElementById('btn-close-story').onclick = () => modal.classList.remove('show');
      const cancelBtn = document.getElementById('btn-story-edit-cancel');
      if (cancelBtn) {
        cancelBtn.onclick = () => {
          state.storyEditing = false;
          state.storyEditIsNew = false;
          renderStoryModal();
        };
      }
      document.getElementById('btn-story-save').onclick = async () => {
        const title = document.getElementById('story-ed-title').value.trim();
        const book = document.getElementById('story-ed-book').value.trim();
        const unit = document.getElementById('story-ed-unit').value.trim();
        const markdown = mdEl.value.trim();
        if (!markdown) {
          showToast('请先粘贴故事 Markdown 内容');
          return;
        }
        const words = extractWordsFromMarkdown(markdown);
        const storyId = target ? target.id : `story-${Date.now()}`;
        try {
          const res = await apiFetch('/api/stories', {
            method: 'POST',
            body: JSON.stringify({
              action: 'upsert',
              story: {
                id: storyId,
                title: title || `情景故事 (${words.length}词)`,
                book,
                unit,
                words,
                markdown
              }
            })
          });
          state.stories = { version: res.version || 1, updatedAt: res.updatedAt, stories: res.stories || [] };
          rebuildStoryIndex();
          state.activeStoryModalId = (res.story && res.story.id) || storyId;
          state.storyEditing = false;
          state.storyEditIsNew = false;
          state.storyRevealedWords.clear();
          state.storyActiveWordKey = '';
          renderStoryModal();
          renderStage();
          showToast(`已保存情景故事（含 ${words.length} 个标注词）`);
        } catch (err) {
          showToast(`保存故事失败: ${err.message}`);
        }
      };
      const delBtn = document.getElementById('btn-story-delete');
      if (delBtn && target) {
        delBtn.onclick = async () => {
          try {
            const res = await apiFetch('/api/stories', {
              method: 'POST',
              body: JSON.stringify({ action: 'delete', id: target.id })
            });
            state.stories = { version: res.version || 1, updatedAt: res.updatedAt, stories: res.stories || [] };
            rebuildStoryIndex();
            state.activeStoryModalId = (state.stories.stories[0] && state.stories.stories[0].id) || null;
            state.storyEditing = false;
            state.storyEditIsNew = false;
            renderStoryModal();
            renderStage();
            showToast('已删除情景故事');
          } catch (err) {
            showToast(`删除失败: ${err.message}`);
          }
        };
      }
      return;
    }

    const parsed = activeStory._parsed || parseStoryMarkdown(activeStory.markdown || '');
    const wordCount = (activeStory.words || []).length;
    const mode = state.storyReadMode;
    const showTable = mode === 'full' ? state.storyShowTable !== false : state.storyShowTable === true;

    let contentHtml = '';
    for (const blk of parsed.blocks) {
      if (blk.type === 'hr') {
        contentHtml += `<hr class="story-hr" />`;
      } else if (blk.type === 'heading') {
        contentHtml += `<h4 class="story-act-title">${formatInlineMdHtml(blk.text)}</h4>`;
      } else if (blk.type === 'paragraph') {
        contentHtml += renderStoryParagraphHtml(blk.text, parsed.tableWords);
      } else if (blk.type === 'table') {
        const thead = blk.headers.length
          ? `<thead><tr>${blk.headers.map((h) => `<th>${escHtml(h)}</th>`).join('')}</tr></thead>`
          : '';
        const tbody = blk.rows
          .map((row) => {
            const rawW = stripSimpleMd(row[0] || '');
            const isEng = /^[A-Za-z][A-Za-z\-']*$/.test(rawW);
            const c0 = isEng
              ? `<span class="story-table-word" data-story-table-word="${escHtml(rawW)}">${escHtml(rawW)}</span>`
              : formatInlineMdHtml(row[0] || '');
            const rest = row.slice(1).map((c) => `<td>${formatInlineMdHtml(c)}</td>`).join('');
            return `<tr><td>${c0}</td>${rest}</tr>`;
          })
          .join('');
        contentHtml += `<div class="story-table-wrap${showTable ? '' : ' is-hidden'}"><table class="story-table">${thead}<tbody>${tbody}</tbody></table></div>`;
      }
    }

    body.innerHTML = `
      <div class="story-modal-head">
        <select id="story-select" class="story-select" title="切换情景故事">
          ${allStories.map((st) => `<option value="${escHtml(st.id)}" ${st.id === activeStory.id ? 'selected' : ''}>${escHtml(st.title || st.id)}</option>`).join('')}
        </select>
        <div class="dir-switch" id="story-mode-switch" role="group" aria-label="故事自测模式">
          <button class="dir-tab ${mode === 'full' ? 'active' : ''}" data-smode="full" title="中英对照阅读">对照</button>
          <button class="dir-tab ${mode === 'hide_zh' ? 'active' : ''}" data-smode="hide_zh" title="盖住中文与表格，只看英文顺词义">隐中文</button>
          <button class="dir-tab ${mode === 'cloze' ? 'active' : ''}" data-smode="cloze" title="遮住英文，看中文语境回忆拼写">隐英文</button>
        </div>
        <button class="btn btn-sm btn-toggle ${showTable ? 'is-on' : ''}" id="btn-story-table" title="展开或折叠词根避坑表">词根表</button>
        <div class="spacer"></div>
        <button class="btn btn-sm" id="btn-story-new">+ 新建</button>
        <button class="btn btn-sm" id="btn-story-edit">✎ 编辑</button>
        <button class="btn btn-sm" id="btn-close-story">关闭 (Esc)</button>
      </div>
      <div class="story-modal-scroll" id="story-modal-scroll">
        <div class="story-reader mode-${escHtml(mode)}">${contentHtml}</div>
      </div>
      <div class="story-modal-foot">
        <div class="story-anchor-preview" id="story-anchor-preview">${renderStoryAnchorPreviewHtml(activeStory)}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn btn-sm btn-primary" id="btn-story-to-review">🎯 去④复习专练 (${wordCount}词)</button>
          <button class="btn btn-sm" id="btn-story-to-listen">🎧 去⑤听词盲听 (${wordCount}词)</button>
        </div>
      </div>
    `;

    document.getElementById('btn-close-story').onclick = () => modal.classList.remove('show');
    document.getElementById('story-select').onchange = (e) => {
      state.activeStoryModalId = e.target.value;
      state.storyRevealedWords.clear();
      state.storyActiveWordKey = '';
      renderStoryModal();
    };
    document.querySelectorAll('#story-mode-switch .dir-tab').forEach((btn) => {
      btn.onclick = () => {
        const nextMode = btn.dataset.smode;
        if (nextMode === state.storyReadMode) return;
        state.storyReadMode = nextMode;
        state.storyShowTable = nextMode === 'full';
        state.storyRevealedWords.clear();
        renderStoryModal();
      };
    });
    document.getElementById('btn-story-table').onclick = () => {
      const curShow = mode === 'full' ? state.storyShowTable !== false : state.storyShowTable === true;
      state.storyShowTable = !curShow;
      renderStoryModal();
    };
    document.getElementById('btn-story-new').onclick = () => {
      state.storyEditing = true;
      state.storyEditIsNew = true;
      renderStoryModal();
    };
    document.getElementById('btn-story-edit').onclick = () => {
      state.storyEditing = true;
      state.storyEditIsNew = false;
      renderStoryModal();
    };

    const syncUnitForStory = () => {
      if (activeStory.unit && state.activeUnit !== 'ALL' && state.activeUnit !== activeStory.unit) {
        state.activeUnit = activeStory.unit;
        const unitSel = document.getElementById('unit-select');
        if (unitSel) unitSel.value = activeStory.unit;
        renderHeaderStats();
      }
    };

    document.getElementById('btn-story-to-review').onclick = () => {
      syncUnitForStory();
      state.reviewFilterStoryId = activeStory.id;
      state.reviewSource = 'story';
      state.reviewOrder = null;
      state.reviewClearedIds.clear();
      modal.classList.remove('show');
      switchStage('review');
      showToast(`已载入故事词汇到 ④ 复习（${wordCount} 词）`);
    };

    document.getElementById('btn-story-to-listen').onclick = () => {
      syncUnitForStory();
      state.reviewFilterStoryId = activeStory.id;
      state.listen.scope = 'story';
      modal.classList.remove('show');
      switchStage('listen');
      showToast(`已切换听词范围为「${activeStory.title}」(${wordCount} 词)`);
    };

    // Story token click & double-click inside reader (in-place update preserves scroll)
    const scrollEl = document.getElementById('story-modal-scroll');
    scrollEl.addEventListener('click', (e) => {
      const tok = e.target.closest('[data-story-word]');
      if (tok) {
        const key = tok.dataset.storyWord;
        const raw = tok.dataset.storyRaw || key;
        state.storyRevealedWords.add(key);
        state.storyActiveWordKey = key;
        playTextAudio(raw, state.listen.voice, 1);
        scrollEl.querySelectorAll('[data-story-word]').forEach((el) => {
          const k = el.dataset.storyWord;
          el.classList.toggle('is-revealed', state.storyRevealedWords.has(k));
          el.classList.toggle('is-active', k === key);
        });
        const previewEl = document.getElementById('story-anchor-preview');
        if (previewEl) previewEl.innerHTML = renderStoryAnchorPreviewHtml(activeStory);
        return;
      }
      const tblWord = e.target.closest('[data-story-table-word]');
      if (tblWord) {
        const raw = tblWord.dataset.storyTableWord;
        state.storyActiveWordKey = raw.toLowerCase();
        playTextAudio(raw, state.listen.voice, 1);
        const previewEl = document.getElementById('story-anchor-preview');
        if (previewEl) previewEl.innerHTML = renderStoryAnchorPreviewHtml(activeStory);
      }
    });

    scrollEl.addEventListener('dblclick', (e) => {
      const tok = e.target.closest('[data-story-word], [data-story-table-word]');
      if (!tok) return;
      const key = (tok.dataset.storyWord || tok.dataset.storyTableWord || '').toLowerCase();
      const book = getActiveBook();
      const match = book && book.wordLowerMap ? book.wordLowerMap.get(key) : null;
      if (match) {
        openDetailModal(match.id);
      } else {
        showToast(`当前词书未收录: ${key}`);
      }
    });
  }

  function openStoryModal(preferredStoryId = null, focusWord = '') {
    const scopeStories = getStoriesForCurrentScope();
    const bookStories = getStoriesForActiveBook();
    const allStories = (state.stories && Array.isArray(state.stories.stories)) ? state.stories.stories : [];

    if (preferredStoryId && allStories.some((st) => st.id === preferredStoryId)) {
      state.activeStoryModalId = preferredStoryId;
    } else if (!state.activeStoryModalId || !allStories.some((st) => st.id === state.activeStoryModalId)) {
      const fallback = scopeStories[0] || bookStories[0] || allStories[0] || null;
      state.activeStoryModalId = fallback ? fallback.id : null;
    }

    state.storyEditing = !state.activeStoryModalId;
    state.storyEditIsNew = false;
    state.storyRevealedWords.clear();
    if (focusWord) {
      const k = String(focusWord).trim().toLowerCase();
      state.storyActiveWordKey = k;
      state.storyRevealedWords.add(k);
    } else {
      state.storyActiveWordKey = '';
    }

    renderStoryModal();
    const modal = document.getElementById('story-modal');
    modal.classList.add('show');

    if (focusWord) {
      const k = String(focusWord).trim().toLowerCase();
      const tok = document.querySelector(`#story-modal-scroll [data-story-word="${CSS.escape(k)}"]`);
      if (tok) tok.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }

  // 7. Render Controls & Stats
  function renderBookTabs() {
    const sel = document.getElementById('book-select');
    if (!sel) return;
    const books = state.manifest.books || [];
    if (!books.length) {
      sel.innerHTML = '<option value="">暂无可用词书</option>';
      sel.disabled = true;
      return;
    }
    sel.disabled = false;
    sel.innerHTML = books
      .map((b) => {
        const countStr = typeof b.totalWords === 'number' ? ` (${b.totalWords}词)` : '';
        return `<option value="${escHtml(b.id)}" ${b.id === state.activeBookId ? 'selected' : ''}>${escHtml((b.shortTitle || b.title) + countStr)}</option>`;
      })
      .join('');
    sel.value = state.activeBookId;
    sel.onchange = async (e) => {
      const id = e.target.value;
      if (!id || id === state.activeBookId) return;
      const prevBookId = state.activeBookId;
      stopListenSession();
      try {
        await ensureBookLoaded(id);
      } catch (err) {
        sel.value = prevBookId;
        showToast(`切换词书失败: ${err.message}`);
        return;
      }
      state.activeBookId = id;
      state.activeUnit = 'ALL';
      state.focusIndex = 0;
      state.cursorWid = null;
      state.sieve2Order = null;
      state.reviewFilterStoryId = null;
      state.reviewOrder = null;
      state.reviewClearedIds.clear();
      scheduleSave();
      renderAll();
      const meta = books.find((b) => b.id === id);
      showToast(`已切换挂载：${(meta && (meta.shortTitle || meta.title)) || id}`);
    };
  }

  function renderUnitSelector() {
    const sel = document.getElementById('unit-select');
    const book = getActiveBook();
    if (!book) { sel.innerHTML = ''; return; }
    const words = book.words || [];
    const allLearning = words.filter(isLearningPool).length;
    let opts = `<option value="ALL">全部单元 (${allLearning}/${words.length} 待攻克)</option>`;
    for (const u of book.units || []) {
      const uWords = words.filter((w) => w.unit === u.id);
      const uLearn = uWords.filter(isLearningPool).length;
      opts += `<option value="${escHtml(u.id)}" ${state.activeUnit === u.id ? 'selected' : ''}>${escHtml(u.title)} [${uLearn}/${uWords.length}]</option>`;
    }
    sel.innerHTML = opts;
    sel.value = state.activeUnit;
  }

  function renderHeaderStats() {
    const scoped = getScopedWords();
    const total = scoped.length;
    const known = scoped.filter(isKnown).length;
    const mastered = scoped.filter(isMastered).length;
    const learning = scoped.filter(isLearningPool).length;
    const starred = scoped.filter((w) => getWordRec(w.id).starred).length;
    const donePct = total ? Math.round(((known + mastered) / total) * 100) : 0;

    const miniEl = document.getElementById('stat-mini-text');
    if (miniEl) miniEl.textContent = `${donePct}%${starred ? ` ★${starred}` : ''}`;
    const lineEl = document.getElementById('top-progress-fill');
    if (lineEl) lineEl.style.width = `${donePct}%`;

    document.getElementById('stats-strip').innerHTML = `
      <span class="stat-pill">范围总词 <b>${total}</b></span>
      <span class="stat-pill">初筛已认 <b>${known}</b></span>
      <span class="stat-pill warn">待攻克 <b>${learning}</b></span>
      <span class="stat-pill accent">二筛掌握 <b>${mastered}</b></span>
      <span class="stat-pill info">星标 <b>${starred}</b></span>
    `;

    // Stage badges
    document.getElementById('badge-triage').textContent = learning;
    document.getElementById('badge-study').textContent = learning;
    document.getElementById('badge-sieve2').textContent = learning;
    document.getElementById('badge-review').textContent = known + mastered;
    document.getElementById('badge-listen').textContent = total;
  }

  function renderStageNav() {
    document.querySelectorAll('.stage-btn').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.stage === state.activeStage);
    });
  }

  // 8. Stage Renderers
  function renderStage() {
    const main = document.getElementById('main-area');
    const book = getActiveBook();
    if (!book) {
      main.innerHTML = '<div class="empty-state">正在加载词库...</div>';
      return;
    }
    if (state.activeStage === 'triage') renderTriageStage(main);
    else if (state.activeStage === 'study') renderStudyStage(main);
    else if (state.activeStage === 'sieve2') renderSieve2Stage(main);
    else if (state.activeStage === 'review') renderReviewStage(main);
    else if (state.activeStage === 'listen') renderListenStage(main);
  }

  function createWordChipHtml(w, options = {}) {
    const rec = getWordRec(w.id);
    const cls = ['word-chip'];
    if (rec.status === 'known' && options.markKnown) cls.push('is-known');
    if (rec.starred) cls.push('is-starred');
    if (rec.review_fail_count > 0 && options.highlightHard) cls.push('is-demoted');
    if (state.cursorWid === w.id) cls.push('is-cursor');

    const isZh2En = options.displayMode === 'zh2en';
    let labelHtml = escHtml(w.word);
    if (isZh2En) {
      const prompt = formatZhPromptForChip(w);
      const posCls = prompt.kind === 'en'
        ? 'chip-pos is-en-fallback'
        : prompt.kind === 'empty'
          ? 'chip-pos is-empty-fallback'
          : 'chip-pos';
      labelHtml = `${prompt.pos ? `<span class="${posCls}">${escHtml(prompt.pos)}</span>` : ''}${escHtml(prompt.text)}`;
    }

    const revPass = Number(rec.review_pass_count) || 0;
    const hasStory = Boolean(getStoryEntryForWord(w.cleanWord || w.word));

    return `
      <div class="${cls.join(' ')}" data-wid="${escHtml(w.id)}">
        <span class="chip-label">${labelHtml}</span>
        <span class="chip-icons">
          ${options.showReviewCount && revPass > 0 ? `<span class="chip-rev-cnt" title="已复习通过 ${revPass} 次">✓${revPass}</span>` : ''}
          ${options.showStoryBadge && hasStory ? '<span class="chip-story-dot" title="含情景故事记忆锚点">📖</span>' : ''}
          ${rec.starred ? '<span class="chip-star">★</span>' : ''}
          ${rec.mnemonic ? '<span title="有个人助记">✎</span>' : ''}
        </span>
      </div>
    `;
  }

  // Active sieve stage action handlers (invoked by single root delegator & keyboard cursor)
  let currentChipHandlers = { left: null, right: null, peek: false };

  function setChipHandlers(leftFn, rightFn, peek = false) {
    currentChipHandlers = { left: leftFn, right: rightFn, peek };
  }

  // --- Stage 1: Initial Triage ---
  function renderTriageStage(main) {
    const scoped = getScopedWords();
    const list = state.triageShowKnown ? scoped : scoped.filter(isLearningPool);

    let html = `
      <div class="toolbar-inline">
        <select id="triage-density" title="词墙密度">
          <option value="ultra" ${state.density === 'ultra' ? 'selected' : ''}>超密</option>
          <option value="compact" ${state.density === 'compact' ? 'selected' : ''}>标准</option>
          <option value="relaxed" ${state.density === 'relaxed' ? 'selected' : ''}>宽松</option>
        </select>
        <button class="btn btn-sm btn-toggle ${state.groupByUnit ? 'is-on' : ''}" id="btn-triage-group">按章分组</button>
        <button class="btn btn-sm btn-toggle ${state.triageShowKnown ? 'is-on' : ''}" id="btn-triage-known">含已认词</button>
        <span class="help-tip" title="左键或 Space 点认识的词消失；右键或 S 键标星；V 键发音看释义；双击看详情">?</span>
        <div class="spacer"></div>
        <button class="btn btn-primary btn-sm" id="btn-goto-study">去② 精学 →</button>
      </div>
    `;

    if (list.length === 0) {
      html += `<div class="empty-state">当前范围内没有未筛选的单词！可以切换单元，或点击右上角“显示已认识词”核查。</div>`;
      main.innerHTML = html;
    } else if (state.groupByUnit && state.activeUnit === 'ALL') {
      const byUnit = new Map();
      for (const w of list) {
        if (!byUnit.has(w.unit)) byUnit.set(w.unit, []);
        byUnit.get(w.unit).push(w);
      }
      for (const [unitName, words] of byUnit.entries()) {
        html += `
          <section class="unit-section">
            <div class="unit-section-header">
              <span>${escHtml(unitName)}</span>
              <span>剩余 ${words.length} 词</span>
            </div>
            <div class="word-grid density-${state.density}">
              ${words.map((w) => createWordChipHtml(w, { markKnown: state.triageShowKnown })).join('')}
            </div>
          </section>
        `;
      }
      main.innerHTML = html;
    } else {
      html += `
        <div class="word-grid density-${state.density}">
