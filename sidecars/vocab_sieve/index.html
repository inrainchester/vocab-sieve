    if (stopBtn) stopBtn.onclick = () => { stopListenSession(); renderListenStage(main); };
  }

  // 9. Tooltip, Cursor, Delegation & Modal Helpers
  function findWordById(wid) {
    const book = getActiveBook();
    if (!book) return null;
    if (book.wordMap) return book.wordMap.get(wid) || null;
    return (book.words || []).find((w) => w.id === wid) || null;
  }

  let peekRafId = 0;
  let peekPendingPos = { x: 0, y: 0 };

  function showPeekTooltip(wid, ev) {
    const w = findWordById(wid);
    if (!w) return;
    const tip = document.getElementById('peek-tooltip');
    tip.classList.toggle('is-zh2en-answer', state.activeStage === 'sieve2' && state.sieve2Direction === 'zh2en');
    document.getElementById('peek-word').textContent = w.word;
    const p = w.phonetics || {};
    document.getElementById('peek-ipa').textContent = [p.uk ? `UK /${p.uk}/` : '', p.us ? `US /${p.us}/` : '', p.respell || ''].filter(Boolean).join(' · ');
    document.getElementById('peek-zh').textContent = w.zhMeaning || w.enMeaning || '暂无释义';
    const rootEl = document.getElementById('peek-root');
    if (rootEl) {
      if (w.rootBreakdown) {
        rootEl.textContent = '🧩 ' + w.rootBreakdown;
        rootEl.style.display = 'block';
      } else {
        rootEl.style.display = 'none';
      }
    }
    tip.classList.add('show');
    movePeekTooltip(ev);
  }

  function movePeekTooltip(ev) {
    const tip = document.getElementById('peek-tooltip');
    if (!tip.classList.contains('show')) return;
    peekPendingPos.x = Math.max(8, Math.min(window.innerWidth - 315, ev.clientX + 14));
    peekPendingPos.y = Math.max(8, Math.min(window.innerHeight - 160, ev.clientY + 14));
    if (!peekRafId) {
      peekRafId = requestAnimationFrame(() => {
        peekRafId = 0;
        tip.style.left = peekPendingPos.x + 'px';
        tip.style.top = peekPendingPos.y + 'px';
      });
    }
  }

  function hidePeekTooltip() {
    document.getElementById('peek-tooltip').classList.remove('show');
  }

  function getVisibleChips() {
    return Array.from(document.querySelectorAll('#main-area .word-chip:not(.vanishing)'));
  }

  function applyCursorToChip(next) {
    document.querySelectorAll('#main-area .word-chip.is-cursor').forEach((el) => el.classList.remove('is-cursor'));
    if (next) {
      next.classList.add('is-cursor');
      state.cursorWid = next.dataset.wid;
      next.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    } else {
      state.cursorWid = null;
    }
    return next;
  }

  function advanceCursorFromChip(chip) {
    if (!chip) return null;
    const chips = getVisibleChips();
    const idx = chips.indexOf(chip);
    const next = idx >= 0 ? (chips[idx + 1] || chips[idx - 1] || null) : (chips[0] || null);
    return applyCursorToChip(next);
  }

  function moveSieveCursor(dir) {
    const chips = getVisibleChips();
    if (!chips.length) return null;
    const curIdx = state.cursorWid ? chips.findIndex((c) => c.dataset.wid === state.cursorWid) : -1;
    if (curIdx < 0) return applyCursorToChip(chips[0]);

    let next = null;
    if (dir === 'left') {
      next = chips[Math.max(0, curIdx - 1)];
    } else if (dir === 'right') {
      next = chips[Math.min(chips.length - 1, curIdx + 1)];
    } else {
      const curRect = chips[curIdx].getBoundingClientRect();
      const curCx = curRect.left + curRect.width / 2;
      const curCy = curRect.top + curRect.height / 2;
      const cands = [];
      for (const c of chips) {
        if (c === chips[curIdx]) continue;
        const r = c.getBoundingClientRect();
        const dy = dir === 'down' ? (r.top + r.height / 2 - curCy) : (curCy - (r.top + r.height / 2));
        if (dy > 8) {
          cands.push({ chip: c, dy, dx: Math.abs(r.left + r.width / 2 - curCx) });
        }
      }
      if (cands.length) {
        cands.sort((a, b) => a.dy - b.dy);
        const minDy = cands[0].dy;
        const sameRow = cands.filter((c) => c.dy <= minDy + 18);
        sameRow.sort((a, b) => a.dx - b.dx);
        next = sameRow[0].chip;
      } else {
        next = dir === 'down' ? chips[Math.min(chips.length - 1, curIdx + 1)] : chips[Math.max(0, curIdx - 1)];
      }
    }
    return applyCursorToChip(next);
  }

  function attachCardAndSieveDelegation(rootEl) {
    if (!rootEl) return;

    rootEl.addEventListener('click', (e) => {
      const speakBtn = e.target.closest('[data-speak]');
      if (speakBtn) {
        e.stopPropagation();
        playTextAudio(speakBtn.dataset.speak, state.listen.voice, 1);
        return;
      }

      const starBtn = e.target.closest('[data-toggle-star]');
      if (starBtn) {
        e.stopPropagation();
        const wid = starBtn.dataset.toggleStar;
        const rec = getWordRec(wid);
        const next = !rec.starred;
        updateWordRec(wid, { starred: next });
        starBtn.classList.toggle('btn-warn', next);
        starBtn.textContent = next ? '★ 已星标' : '☆ 星标';
        return;
      }

      const masterBtn = e.target.closest('[data-mark-mastered]');
      if (masterBtn) {
        e.stopPropagation();
        const wid = masterBtn.dataset.markMastered;
        const rec = getWordRec(wid);
        const nextStatus = rec.status === 'mastered' ? 'learning' : 'mastered';
        updateWordRec(wid, { status: nextStatus });
        masterBtn.classList.toggle('btn-primary', nextStatus === 'mastered');
        masterBtn.textContent = nextStatus === 'mastered' ? '✓ 已掌握' : '标记掌握';
        return;
      }

      const jumpBtn = e.target.closest('[data-jump-word]');
      if (jumpBtn) {
        e.stopPropagation();
        const targetWord = jumpBtn.dataset.jumpWord.trim().toLowerCase();
        const book = getActiveBook();
        const match = book && book.wordLowerMap ? book.wordLowerMap.get(targetWord) : null;
        if (match) {
          openDetailModal(match.id);
        } else {
          showToast(`当前词书未收录: ${jumpBtn.dataset.jumpWord}`);
        }
        return;
      }

      const replayBtn = e.target.closest('[data-replay]');
      if (replayBtn) {
        e.stopPropagation();
        playTextAudio(replayBtn.dataset.replay, state.listen.voice, 1);
        return;
      }

      const detailBtn = e.target.closest('[data-open-detail]');
      if (detailBtn) {
        e.stopPropagation();
        openDetailModal(detailBtn.dataset.openDetail);
        return;
      }

      const maskedBody = e.target.closest('.study-body.is-masked');
      if (maskedBody && !e.target.closest('textarea, button, .cognate-chip')) {
        maskedBody.classList.remove('is-masked');
        return;
      }

      const chip = e.target.closest('.word-chip');
      if (chip) {
        e.preventDefault();
        const wid = chip.dataset.wid;
        if (e.altKey) {
          if (currentChipHandlers.right) currentChipHandlers.right(wid, chip);
        } else {
          if (currentChipHandlers.left) currentChipHandlers.left(wid, chip);
        }
      }
    });

    rootEl.addEventListener('contextmenu', (e) => {
      const chip = e.target.closest('.word-chip');
      if (!chip) return;
      e.preventDefault();
      if (currentChipHandlers.right) currentChipHandlers.right(chip.dataset.wid, chip);
    });

    rootEl.addEventListener('dblclick', (e) => {
      const chip = e.target.closest('.word-chip');
      if (!chip) return;
      e.preventDefault();
      openDetailModal(chip.dataset.wid);
    });

    rootEl.addEventListener('mouseover', (e) => {
      const chip = e.target.closest('.word-chip');
      if (!chip || !currentChipHandlers.peek) return;
      if (e.relatedTarget && chip.contains(e.relatedTarget)) return;
      showPeekTooltip(chip.dataset.wid, e);
    });

    rootEl.addEventListener('mouseout', (e) => {
      const chip = e.target.closest('.word-chip');
      if (!chip || !currentChipHandlers.peek) return;
      if (e.relatedTarget && chip.contains(e.relatedTarget)) return;
      hidePeekTooltip();
    });

    rootEl.addEventListener('mousemove', (e) => {
      const chip = e.target.closest('.word-chip');
      if (!chip || !currentChipHandlers.peek) return;
      movePeekTooltip(e);
    });

    rootEl.addEventListener('input', (e) => {
      const ta = e.target.closest('[data-mnemonic-wid]');
      if (!ta) return;
      updateWordRec(ta.dataset.mnemonicWid, { mnemonic: ta.value }, false);
    });
  }

  function openDetailModal(wid) {
    const w = findWordById(wid);
    if (!w) return;
    const modal = document.getElementById('detail-modal');
    const body = document.getElementById('detail-modal-body');
    body.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span class="hint-text">${escHtml(w.unit)} · ${escHtml(w.rootGroup || '')}</span>
        <button class="btn btn-sm" id="btn-close-modal">关闭 (Esc)</button>
      </div>
      ${renderWordDetailCardHtml(w, false)}
    `;
    modal.classList.add('show');
    document.getElementById('btn-close-modal').onclick = () => modal.classList.remove('show');
  }

  function switchStage(stage) {
    if (state.activeStage === 'listen' && stage !== 'listen') {
      stopListenSession();
    }
    state.activeStage = stage;
    scheduleSave();
    renderStageNav();
    renderStage();
  }

  function renderAll() {
    renderBookTabs();
    renderUnitSelector();
    renderHeaderStats();
    renderStageNav();
    renderStage();
  }

  // 10. Global Events & Shortcuts
  attachCardAndSieveDelegation(document.getElementById('main-area'));
  attachCardAndSieveDelegation(document.getElementById('detail-modal-body'));

  document.getElementById('stage-nav').querySelectorAll('.stage-btn').forEach((btn) => {
    btn.onclick = () => switchStage(btn.dataset.stage);
  });

  document.getElementById('unit-select').onchange = (e) => {
    state.activeUnit = e.target.value;
    state.focusIndex = 0;
    state.sieve2Order = null;
    state.reviewOrder = null;
    state.reviewClearedIds.clear();
    scheduleSave();
    renderHeaderStats();
    renderStage();
  };

  document.getElementById('search-input').addEventListener('input', (e) => {
    state.searchQuery = e.target.value;
    state.focusIndex = 0;
    renderHeaderStats();
    renderStage();
  });

  document.getElementById('btn-undo').onclick = performUndo;

  document.getElementById('btn-export-md').onclick = async () => {
    const book = getActiveBook();
    const scoped = getScopedWords();
    const exportList = scoped.filter((w) => isLearningPool(w) || getWordRec(w.id).starred);
    if (!exportList.length) {
      showToast('当前范围没有待攻克或已星标的单词');
      return;
    }
    const unitLabel = state.activeUnit === 'ALL' ? '全部单元' : state.activeUnit;
    const lines = [
      `# ${(book && book.title) || state.activeBookId} — ${unitLabel} 生词导出 (${exportList.length} 词)`,
      ''
    ];
    for (const w of exportList) {
      const rec = getWordRec(w.id);
      const p = w.phonetics || {};
      const ipa = [p.uk ? `UK /${p.uk}/` : '', p.us ? `US /${p.us}/` : ''].filter(Boolean).join(' ');
      const tags = [rec.starred ? '★星标' : '', w.pos || '', w.rootGroup || ''].filter(Boolean).join(' · ');
      lines.push(`### ${w.word}${ipa ? ` \`${ipa}\`` : ''}${tags ? ` (${tags})` : ''}`);
      if (w.zhMeaning) lines.push(`- **中文**：${w.zhMeaning.replace(/\n+/g, '；')}`);
      if (w.enMeaning) lines.push(`- **英文**：${w.enMeaning.replace(/\n+/g, ' ')}`);
      if (w.rootBreakdown) lines.push(`- **词根拆解**：${w.rootBreakdown}`);
      if (w.etymology) lines.push(`- **简明词源**：${w.etymology}`);
      if (w.contextExplanation) lines.push(`- **精讲/词源**：${w.contextExplanation.replace(/\n+/g, ' ')}`);
      if (rec.mnemonic) lines.push(`- **助记**：${rec.mnemonic.replace(/\n+/g, ' ')}`);
      lines.push('');
    }
    const md = lines.join('\n');
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(md);
      } else {
        throw new Error('no clipboard api');
      }
    } catch (_) {
      const ta = document.createElement('textarea');
      ta.value = md;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    showToast(`已复制 ${exportList.length} 个词的 Markdown 笔记到剪贴板`);
    document.getElementById('top-more-menu')?.removeAttribute('open');
  };

  document.getElementById('btn-theme').onclick = () => {
    const nextDark = !document.documentElement.classList.contains('dark');
    document.documentElement.classList.toggle('dark', nextDark);
    localStorage.setItem('vocab_sieve_theme', nextDark ? 'dark' : 'light');
    document.getElementById('top-more-menu')?.removeAttribute('open');
  };

  document.addEventListener('click', (e) => {
    document.querySelectorAll('details.top-more-menu[open], details.stage-pop-menu[open]').forEach((d) => {
      if (!d.contains(e.target)) d.removeAttribute('open');
    });
  });

  document.getElementById('detail-modal').addEventListener('click', (e) => {
    if (e.target.id === 'detail-modal') {
      e.target.classList.remove('show');
    }
  });

  window.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) || '';
    const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !isTyping) {
      e.preventDefault();
      performUndo();
      return;
    }
    if (e.key === 'Escape') {
      document.getElementById('detail-modal').classList.remove('show');
      hidePeekTooltip();
      document.querySelectorAll('details.top-more-menu[open], details.stage-pop-menu[open]').forEach((d) => d.removeAttribute('open'));
      return;
    }
    if (isTyping) return;

    // Listening mode shortcuts
    if (state.activeStage === 'listen' && state.listen.running) {
      if (e.code === 'Space') {
        e.preventDefault();
        handleListenPass();
      } else if (e.key === 'Enter' || e.key === 'ArrowDown') {
        e.preventDefault();
        handleListenMiss();
      } else if (e.key.toLowerCase() === 'r') {
        e.preventDefault();
        const w = state.listen.queue[state.listen.index];
        if (w) playTextAudio(w.cleanWord || w.word, state.listen.voice, 1);
      } else if (e.key.toLowerCase() === 'p') {
        e.preventDefault();
        const pauseBtn = document.getElementById('btn-listen-pause');
        if (pauseBtn) pauseBtn.click();
      }
      return;
    }

    // Focus study card shortcuts
    if (state.activeStage === 'study' && state.studyMode === 'focus') {
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        document.getElementById('btn-focus-next')?.click();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        document.getElementById('btn-focus-prev')?.click();
      } else if (e.code === 'Space') {
        e.preventDefault();
        document.getElementById('btn-focus-reveal')?.click();
      } else if (e.key.toLowerCase() === 'p') {
        e.preventDefault();
        const card = document.querySelector('[data-speak]');
        if (card) card.click();
      }
      return;
    }

    // Keyboard speed sieve shortcuts for Stage 1 / Stage 3 / Stage 4
    const modalOpen = document.getElementById('detail-modal').classList.contains('show');
    if (!modalOpen && ['triage', 'sieve2', 'review'].includes(state.activeStage)) {
      const k = e.key.toLowerCase();
      if (e.key === 'ArrowLeft' || k === 'h') {
        e.preventDefault();
        moveSieveCursor('left');
      } else if (e.key === 'ArrowRight' || k === 'l') {
        e.preventDefault();
        moveSieveCursor('right');
      } else if (e.key === 'ArrowUp' || k === 'k') {
        e.preventDefault();
        moveSieveCursor('up');
      } else if (e.key === 'ArrowDown' || k === 'j') {
        e.preventDefault();
        moveSieveCursor('down');
      } else if (e.code === 'Space' || e.key === 'Enter') {
        e.preventDefault();
        let chip = state.cursorWid ? document.querySelector('#main-area .word-chip.is-cursor') : null;
        if (!chip) chip = moveSieveCursor('right');
        if (chip && currentChipHandlers.left) currentChipHandlers.left(chip.dataset.wid, chip);
      } else if (k === 's') {
        e.preventDefault();
        let chip = state.cursorWid ? document.querySelector('#main-area .word-chip.is-cursor') : null;
        if (!chip) chip = moveSieveCursor('right');
        if (chip && currentChipHandlers.right) currentChipHandlers.right(chip.dataset.wid, chip);
      } else if (k === 'v') {
        e.preventDefault();
        let chip = state.cursorWid ? document.querySelector('#main-area .word-chip.is-cursor') : null;
        if (!chip) chip = moveSieveCursor('right');
        if (chip) {
          const w = findWordById(chip.dataset.wid);
          if (w) {
            playTextAudio(w.cleanWord || w.word, state.listen.voice, 1);
            const r = chip.getBoundingClientRect();
            showPeekTooltip(w.id, { clientX: r.left, clientY: r.bottom });
          }
        }
      } else if (k === 'm' && state.activeStage === 'sieve2') {
        e.preventDefault();
        state.sieve2Direction = state.sieve2Direction === 'zh2en' ? 'en2zh' : 'zh2en';
        hidePeekTooltip();
        scheduleSave();
        renderSieve2Stage(document.getElementById('main-area'));
        showToast(state.sieve2Direction === 'zh2en' ? '已切换：看中文回顾英文' : '已切换：看英文回顾中文');
      }
    }
  });

  // 11. Bootstrap
  (async function init() {
    try {
      if (!state.manifest.books || !state.manifest.books.length) {
        state.manifest = await apiFetch('/api/manifest');
      }
      if (!state.manifest.books.some((b) => b.id === state.activeBookId) && state.manifest.books.length) {
        state.activeBookId = state.manifest.books[0].id;
      }
      await ensureBookLoaded(state.activeBookId);
      renderAll();
    } catch (err) {
      document.getElementById('main-area').innerHTML = `<div class="empty-state">加载失败: ${escHtml(err.message)}</div>`;
    }
  })();
})();
</script>
