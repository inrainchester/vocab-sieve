          ${list.map((w) => createWordChipHtml(w, { markKnown: state.triageShowKnown })).join('')}
        </div>
      `;
      main.innerHTML = html;
    }

    document.getElementById('triage-density').onchange = (e) => {
      state.density = e.target.value;
      scheduleSave();
      renderTriageStage(main);
    };
    document.getElementById('btn-triage-group').onclick = () => {
      state.groupByUnit = !state.groupByUnit;
      renderTriageStage(main);
    };
    document.getElementById('btn-triage-known').onclick = () => {
      state.triageShowKnown = !state.triageShowKnown;
      renderTriageStage(main);
    };
    document.getElementById('btn-goto-study').onclick = () => switchStage('study');

    setChipHandlers(
      (wid, chip) => {
        const rec = getWordRec(wid);
        if (state.triageShowKnown && rec.status === 'known') {
          updateWordRec(wid, { status: 'learning', triage_known: false });
          chip.classList.remove('is-known');
          showToast('已恢复到待攻克');
          return;
        }
        advanceCursorFromChip(chip);
        chip.classList.add('vanishing');
        updateWordRec(wid, { status: 'known', triage_known: true });
        setTimeout(() => chip.remove(), 145);
      },
      (wid, chip) => {
        const rec = getWordRec(wid);
        const nextStar = !rec.starred;
        updateWordRec(wid, { starred: nextStar, status: rec.status === 'known' ? 'learning' : (rec.status || 'learning') });
        chip.classList.toggle('is-starred', nextStar);
        showToast(nextStar ? '已加星并保留在待攻克' : '已取消星标');
      },
      false
    );
  }

  // --- Stage 2: Deep Study ---
  function renderWordDetailCardHtml(w, isFocus = false) {
    const rec = getWordRec(w.id);
    const p = w.phonetics || {};
    const ipaParts = [];
    if (p.uk) ipaParts.push(`UK /${escHtml(p.uk)}/`);
    if (p.us) ipaParts.push(`US /${escHtml(p.us)}/`);
    const respellHtml = p.respell ? `<span class="respell-tag">${escHtml(p.respell)}</span>` : '';
    const posHtml = w.pos ? `<span class="pos-tag">${escHtml(w.pos)}</span>` : '';

    const examplesHtml = (w.examples || [])
      .map(
        (ex) => `
        <div class="example-item">
          <div>
            ${highlightWordInText(ex.en, w.cleanWord)}
            <button class="btn btn-sm" style="padding:1px 5px;margin-left:4px;" data-speak="${escHtml(ex.en)}">🔊</button>
            <span class="example-src">${escHtml(ex.source || '')}</span>
          </div>
          ${ex.zh ? `<div class="example-zh">${escHtml(ex.zh)}</div>` : ''}
        </div>
      `
      )
      .join('');

    const cognatesHtml = (w.cognates || []).length
      ? `<div class="cognate-row">
          ${w.cognates.map((cw) => `<span class="cognate-chip" data-jump-word="${escHtml(cw)}">${escHtml(cw)}</span>`).join('')}
        </div>`
      : '<span class="hint-text">暂无同根关联词</span>';

    const hiddenCls = isFocus && !state.focusReveal ? 'style="display:none;"' : '';
    const maskCls = !isFocus && state.studyMask ? ' is-masked' : '';
    const storyInfo = getStoryEntryForWord(w.cleanWord || w.word);

    return `
      <div class="study-card" data-card-wid="${escHtml(w.id)}">
        <div class="study-card-head">
          <span class="study-word">${escHtml(w.word)}</span>
          <button class="btn btn-sm" data-speak="${escHtml(w.cleanWord || w.word)}">🔊 发音</button>
          ${ipaParts.length ? `<span class="ipa-tag">${ipaParts.join(' · ')}</span>` : ''}
          ${respellHtml}
          ${posHtml}
          <div class="spacer"></div>
          <button class="btn btn-sm ${rec.starred ? 'btn-warn' : ''}" data-toggle-star="${escHtml(w.id)}">${rec.starred ? '★ 已星标' : '☆ 星标'}</button>
          <button class="btn btn-sm ${rec.status === 'mastered' ? 'btn-primary' : ''}" data-mark-mastered="${escHtml(w.id)}">${rec.status === 'mastered' ? '✓ 已掌握' : '标记掌握'}</button>
        </div>

        <div class="study-body${maskCls}" ${hiddenCls}>
          ${w.zhMeaning ? `
            <div class="study-block maskable">
              <div class="study-label">中文释义</div>
              <div class="zh-meaning">${escHtml(w.zhMeaning)}</div>
            </div>` : ''}

          ${w.enMeaning ? `
            <div class="study-block maskable">
              <div class="study-label">英文释义</div>
              <div class="en-meaning">${highlightWordInText(w.enMeaning, w.cleanWord)}</div>
            </div>` : ''}

          ${(w.rootBreakdown || w.etymology) ? `
            <div class="study-block">
              <div class="study-label">词根词缀拆解 & 词源追溯</div>
              <div class="study-root-box">
                ${w.rootBreakdown ? `<div class="study-root-breakdown"><span class="root-badge">拆解</span><span>${escHtml(w.rootBreakdown)}</span></div>` : ''}
                ${w.etymology ? `<div class="study-root-etym"><span class="etym-badge">词源</span><span>${escHtml(w.etymology)}</span></div>` : ''}
              </div>
            </div>` : ''}

          ${w.contextExplanation ? `
            <div class="study-block">
              <div class="study-label">原书语境精讲 & 词源故事</div>
              <div class="context-box">${highlightWordInText(w.contextExplanation, w.cleanWord)}</div>
            </div>` : ''}

          ${storyInfo ? `
            <div class="study-block">
              <div class="study-label" style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
                <span>📖 情景故事锚点（${escHtml(storyInfo.storyTitle)}）</span>
                <button class="btn btn-sm" style="padding:1px 6px;font-size:11px;" data-open-story="${escHtml(storyInfo.storyId)}" data-story-focus="${escHtml((w.cleanWord || w.word).toLowerCase())}">查看全文</button>
              </div>
              <div class="story-anchor-box">
                ${storyInfo.anchor ? `<div class="story-anchor-line"><b>锚点：</b>${formatInlineMdHtml(storyInfo.anchor)}</div>` : ''}
                ${storyInfo.sentence ? `<div class="story-sentence-line"><b>语境：</b>${highlightWordInText(storyInfo.sentence, w.cleanWord || w.word)}</div>` : ''}
              </div>
            </div>` : ''}

          ${examplesHtml ? `
            <div class="study-block">
              <div class="study-label">例句</div>
              ${examplesHtml}
            </div>` : ''}

          <div class="study-block">
            <div class="study-label">词根 / 同根词串联 (${escHtml(w.rootGroup || w.unit)})</div>
            ${cognatesHtml}
          </div>

          <div class="study-block">
            <div class="study-label">个人辅助记忆 / 笔记 (自动保存)</div>
            <textarea class="mnemonic-box" data-mnemonic-wid="${escHtml(w.id)}" placeholder="写下谐音、拆分联想或例句记忆法...">${escHtml(rec.mnemonic || '')}</textarea>
          </div>
        </div>
      </div>
    `;
  }

  function renderStudyStage(main) {
    const book = getActiveBook();
    let scoped = getScopedWords();
    let list = state.studyShowAll ? scoped : scoped.filter(isLearningPool);
    const scopeStories = getStoriesForCurrentScope();

    let html = `
      <div class="toolbar-inline">
        <button class="btn btn-sm btn-toggle ${state.studyMode === 'focus' ? 'is-on' : ''}" id="btn-study-mode">${state.studyMode === 'list' ? '单卡模式' : '列表模式'}</button>
        ${state.studyMode === 'list' ? `<button class="btn btn-sm btn-toggle ${state.studyMask ? 'is-on' : ''}" id="btn-study-mask">遮罩自测</button>` : ''}
        <button class="btn btn-sm btn-toggle ${state.studyShowAll ? 'is-on' : ''}" id="btn-study-all">含已掌握</button>
        <div class="spacer"></div>
        <button class="btn btn-sm" data-open-story="" title="查看或粘贴情景记忆故事">📖 故事${scopeStories.length ? ` (${scopeStories.length})` : ''}</button>
        <button class="btn btn-primary btn-sm" id="btn-goto-sieve2">去③ 二筛 →</button>
      </div>
    `;

    if (list.length === 0) {
      html += `<div class="empty-state">当前范围没有待攻克的词。可切换单元，或点击“显示本范围全部词”。</div>`;
      main.innerHTML = html;
    } else if (state.studyMode === 'focus') {
      if (state.focusIndex >= list.length) state.focusIndex = 0;
      const w = list[state.focusIndex];
      prefetchUpcomingAudio(list, state.focusIndex, 4, state.listen.voice);
      html += `
        <div class="focus-nav">
          <button class="btn btn-sm" id="btn-focus-prev">← 上一个</button>
          <span class="hint-text">第 <b>${state.focusIndex + 1}</b> / ${list.length} 词 · 快捷键: <code>←/→</code> 切词 · <code>Space</code> 显隐释义 · <code>P</code> 发音</span>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-sm" id="btn-focus-reveal">${state.focusReveal ? '隐藏释义自测' : '显示释义'}</button>
            <button class="btn btn-sm" id="btn-focus-next">下一个 →</button>
          </div>
        </div>
      `;
      if (w.rootIntro) {
        html += `<div class="root-banner"><div class="root-banner-title">${escHtml(w.rootGroup)}</div><div class="root-banner-desc">${escHtml(w.rootIntro)}</div></div>`;
      }
      html += renderWordDetailCardHtml(w, true);
      main.innerHTML = html;

      document.getElementById('btn-focus-prev').onclick = () => {
        state.focusIndex = (state.focusIndex - 1 + list.length) % list.length;
        renderStudyStage(main);
      };
      document.getElementById('btn-focus-next').onclick = () => {
        state.focusIndex = (state.focusIndex + 1) % list.length;
        renderStudyStage(main);
      };
      document.getElementById('btn-focus-reveal').onclick = () => {
        state.focusReveal = !state.focusReveal;
        renderStudyStage(main);
      };
    } else {
      const truncated = state.activeUnit === 'ALL' && list.length > 100;
      const renderList = truncated ? list.slice(0, 100) : list;
      if (truncated) {
        html += `<div class="root-banner" style="margin-top:0;"><div class="root-banner-title">提示：当前选择“全部单元” (共 ${list.length} 词)</div><div class="root-banner-desc">精学阶段建议在顶部下拉框按单个 Unit / Chapter 逐个攻克；当前展示前 100 词。</div></div>`;
      }

      let lastRootKey = null;
      for (const w of renderList) {
        const rk = `${w.unit}::${w.rootGroup}`;
        if (rk !== lastRootKey) {
          lastRootKey = rk;
          if (w.rootIntro || w.rootGroup) {
            html += `<div class="root-banner"><div class="root-banner-title">${escHtml(w.unit)} · ${escHtml(w.rootGroup || '')}</div>${w.rootIntro ? `<div class="root-banner-desc">${escHtml(w.rootIntro)}</div>` : ''}</div>`;
          }
        }
        html += renderWordDetailCardHtml(w, false);
      }

      // Bottom unit navigation bar
      const units = (book && book.units) || [];
      const curUnitIdx = units.findIndex((u) => u.id === state.activeUnit);
      html += `
        <div class="unit-bottom-nav">
          <button class="btn btn-sm" id="btn-unit-prev" ${curUnitIdx <= 0 ? 'disabled' : ''}>← 上一单元</button>
          <button class="btn btn-primary btn-sm" id="btn-unit-sieve2-bottom">进入本范围 ③ 二次筛选 →</button>
          <button class="btn btn-sm" id="btn-unit-next" ${curUnitIdx < 0 || curUnitIdx >= units.length - 1 ? 'disabled' : ''}>下一单元 →</button>
        </div>
      `;
      main.innerHTML = html;

      document.getElementById('btn-unit-sieve2-bottom').onclick = () => switchStage('sieve2');
      document.getElementById('btn-unit-prev').onclick = () => {
        if (curUnitIdx > 0) jumpToUnit(units[curUnitIdx - 1].id);
      };
      document.getElementById('btn-unit-next').onclick = () => {
        if (curUnitIdx >= 0 && curUnitIdx < units.length - 1) jumpToUnit(units[curUnitIdx + 1].id);
      };
    }

    document.getElementById('btn-study-all').onclick = () => {
      state.studyShowAll = !state.studyShowAll;
      state.focusIndex = 0;
      renderStudyStage(main);
    };
    document.getElementById('btn-study-mode').onclick = () => {
      state.studyMode = state.studyMode === 'list' ? 'focus' : 'list';
      renderStudyStage(main);
    };
    const maskBtn = document.getElementById('btn-study-mask');
    if (maskBtn) {
      maskBtn.onclick = () => {
        state.studyMask = !state.studyMask;
        renderStudyStage(main);
      };
    }
    document.getElementById('btn-goto-sieve2').onclick = () => switchStage('sieve2');
  }

  function jumpToUnit(unitId) {
    state.activeUnit = unitId;
    state.focusIndex = 0;
    state.sieve2Order = null;
    state.reviewFilterStoryId = null;
    state.reviewOrder = null;
    state.reviewClearedIds.clear();
    document.getElementById('unit-select').value = unitId;
    scheduleSave();
    renderHeaderStats();
    renderStage();
    document.getElementById('main-area').scrollTop = 0;
  }

  // --- Stage 3: Secondary Sieve ---
  function renderSieve2Stage(main) {
    let list = getScopedWords().filter(isLearningPool);
    if (state.sieve2Order && state.sieve2Order.length) {
      const byId = new Map(list.map((w) => [w.id, w]));
      const ordered = state.sieve2Order.map((id) => byId.get(id)).filter(Boolean);
      const seen = new Set(ordered.map((w) => w.id));
      list = [...ordered, ...list.filter((w) => !seen.has(w.id))];
    }

    const isZh2En = state.sieve2Direction === 'zh2en';
    const scopeStories = getStoriesForCurrentScope();

    let html = `
      <div class="toolbar-inline">
        <div class="dir-switch" id="sieve2-dir-switch" role="group" aria-label="二筛中英回顾方向">
          <button class="dir-tab ${!isZh2En ? 'active' : ''}" data-dir="en2zh" title="看英文回顾中文 (M)">英→中</button>
          <button class="dir-tab ${isZh2En ? 'active' : ''}" data-dir="zh2en" title="看中文回顾英文 (M)">中→英</button>
        </div>
        <button class="btn btn-sm" id="btn-sieve2-shuffle">乱序洗牌</button>
        <button class="btn btn-sm btn-toggle ${state.sieve2Peek ? 'is-on' : ''}" id="btn-sieve2-peek">${isZh2En ? '悬停看词' : '悬停释义'}</button>
        <span class="help-tip" title="${isZh2En ? '看中文回顾英文：左键或 Space 点想得起英文的词消失（标为已掌握）；悬停或按 V 键核对英文与发音；M 键切换中英' : '看英文回顾中文：左键或 Space 点记住了的词消失（标为已掌握）；悬停或按 V 键看释义发音；M 键切换中英'}">?</span>
        <div class="spacer"></div>
        <button class="btn btn-sm" data-open-story="" title="查看或粘贴情景记忆故事">📖 故事${scopeStories.length ? ` (${scopeStories.length})` : ''}</button>
        <button class="btn btn-primary btn-sm" id="btn-sieve2-back">回② 精学 (${list.length}) →</button>
      </div>
    `;

    if (list.length === 0) {
      html += `<div class="empty-state">本范围词已全部二筛通过！你可以前往“④ 筛选复习”或“⑤ 极速听词”巩固，或切换下一单元。</div>`;
      main.innerHTML = html;
    } else {
      html += `<div class="word-grid density-${state.density}${isZh2En ? ' mode-zh2en' : ''}">${list.map((w) => createWordChipHtml(w, { displayMode: state.sieve2Direction, showStoryBadge: true })).join('')}</div>`;
      main.innerHTML = html;
    }

    document.querySelectorAll('#sieve2-dir-switch .dir-tab').forEach((btn) => {
      btn.onclick = () => {
        const nextDir = btn.dataset.dir;
        if (nextDir === state.sieve2Direction) return;
        state.sieve2Direction = nextDir;
        hidePeekTooltip();
        scheduleSave();
        renderSieve2Stage(main);
      };
    });
    document.getElementById('btn-sieve2-shuffle').onclick = () => {
      state.sieve2Order = shuffleArray(list.map((w) => w.id));
      renderSieve2Stage(main);
    };
    document.getElementById('btn-sieve2-peek').onclick = () => {
      state.sieve2Peek = !state.sieve2Peek;
      renderSieve2Stage(main);
    };
    document.getElementById('btn-sieve2-back').onclick = () => switchStage('study');

    setChipHandlers(
      (wid, chip) => {
        hidePeekTooltip();
        advanceCursorFromChip(chip);
        chip.classList.add('vanishing');
        updateWordRec(wid, { status: 'mastered', stage3_passed: true });
        setTimeout(() => {
          chip.remove();
          const backBtn = document.getElementById('btn-sieve2-back');
          if (backBtn) backBtn.textContent = `回② 精学 (${getScopedWords().filter(isLearningPool).length}) →`;
        }, 145);
      },
      (wid, chip) => {
        const rec = getWordRec(wid);
        const nextStar = !rec.starred;
        updateWordRec(wid, { starred: nextStar });
        chip.classList.toggle('is-starred', nextStar);
      },
      state.sieve2Peek
    );
  }

  // --- Stage 4: Review Sieve ---
  function isDueForMultiReview(rec) {
    const passCnt = Number(rec.review_pass_count) || 0;
    if (passCnt < 3) return true;
    if (!rec.last_reviewed_at) return true;
    const elapsedMs = Date.now() - new Date(rec.last_reviewed_at).getTime();
    return Number.isNaN(elapsedMs) || elapsedMs >= 18 * 3600 * 1000;
  }

  function getReviewPool({ includeCleared = false } = {}) {
    const scoped = getScopedWords();
    const bookStories = getStoriesForActiveBook();
    if (state.reviewSource === 'story' && !bookStories.length) {
      state.reviewSource = 'stage3_due';
    }

    let pool = [];
    if (state.reviewSource === 'stage3_due') {
      pool = scoped.filter((w) => {
        const r = getWordRec(w.id);
        return r.stage3_passed === true && r.status === 'mastered' && isDueForMultiReview(r);
      });
    } else if (state.reviewSource === 'stage3') {
      pool = scoped.filter((w) => {
        const r = getWordRec(w.id);
        return r.stage3_passed === true && r.status === 'mastered';
      });
    } else if (state.reviewSource === 'triage') {
      pool = scoped.filter((w) => getWordRec(w.id).triage_known === true && isKnown(w));
    } else if (state.reviewSource === 'hard') {
      pool = scoped.filter((w) => {
        const r = getWordRec(w.id);
        return r.starred || (r.audio_miss_count || 0) > 0 || (r.review_fail_count || 0) > 0;
      });
    } else if (state.reviewSource === 'story') {
      const storyWordSet = getActiveStoryWordSet();
      pool = scoped.filter((w) => storyWordSet.has((w.cleanWord || w.word).toLowerCase()));
    } else if (state.reviewSource === 'all_mastered') {
      pool = scoped.filter((w) => isKnown(w) || isMastered(w));
    } else if (state.reviewSource === 'random80') {
      pool = shuffleArray(scoped).slice(0, 80);
    }

    if (state.reviewOrder && state.reviewOrder.length) {
      const byId = new Map(pool.map((w) => [w.id, w]));
      const ordered = state.reviewOrder.map((id) => byId.get(id)).filter(Boolean);
      const seen = new Set(ordered.map((w) => w.id));
      pool = [...ordered, ...pool.filter((w) => !seen.has(w.id))];
    } else if (state.reviewSource !== 'random80') {
      pool.sort((a, b) => {
        const ra = getWordRec(a.id);
        const rb = getWordRec(b.id);
        const pa = Number(ra.review_pass_count) || 0;
        const pb = Number(rb.review_pass_count) || 0;
        if (pa !== pb) return pa - pb;
        const fa = Number(ra.review_fail_count) || 0;
        const fb = Number(rb.review_fail_count) || 0;
        if (fb !== fa) return fb - fa;
        const sa = ra.starred ? 1 : 0;
        const sb = rb.starred ? 1 : 0;
        if (sb !== sa) return sb - sa;
        return (a.order || 0) - (b.order || 0);
      });
    }
    return includeCleared ? pool : pool.filter((w) => !state.reviewClearedIds.has(w.id));
  }

  function renderReviewStage(main) {
    const list = getReviewPool();
    const fullPoolCount = getReviewPool({ includeCleared: true }).length;
    const isZh2En = state.reviewDirection === 'zh2en';
    const scopeStories = getStoriesForCurrentScope();
    const bookStories = getStoriesForActiveBook();
    const hasStories = bookStories.length > 0;
    const storyWordSet = hasStories ? getActiveStoryWordSet() : new Set();

    let html = `
      <div class="toolbar-inline">
        <div class="dir-switch" id="review-dir-switch" role="group" aria-label="复习中英回顾方向">
          <button class="dir-tab ${!isZh2En ? 'active' : ''}" data-dir="en2zh" title="看英文回顾中文 (M)">英→中</button>
          <button class="dir-tab ${isZh2En ? 'active' : ''}" data-dir="zh2en" title="看中文回顾英文 (M)">中→英</button>
        </div>
        <select id="review-source">
          <option value="stage3_due" ${state.reviewSource === 'stage3_due' ? 'selected' : ''}>二筛词 · 待多轮巩固 (&lt;3次或隔天)</option>
          <option value="stage3" ${state.reviewSource === 'stage3' ? 'selected' : ''}>二筛才过的词 · 全部</option>
          <option value="hard" ${state.reviewSource === 'hard' ? 'selected' : ''}>星标 / 听词未过 / 曾忘词</option>
          ${hasStories ? `<option value="story" ${state.reviewSource === 'story' ? 'selected' : ''}>📖 情景故事顽固词 (${storyWordSet.size})</option>` : ''}
          <option value="triage" ${state.reviewSource === 'triage' ? 'selected' : ''}>初筛秒过词 (抽查防假熟)</option>
          <option value="all_mastered" ${state.reviewSource === 'all_mastered' ? 'selected' : ''}>本范围全部已掌握词</option>
          <option value="random80" ${state.reviewSource === 'random80' ? 'selected' : ''}>随机抽查 80 词</option>
        </select>
        <button class="btn btn-sm" id="btn-review-shuffle">洗牌</button>
        <button class="btn btn-sm btn-toggle ${state.reviewDemoteClick ? 'is-on' : ''}" id="btn-review-mode" title="开启后左键点击直接打回待攻克">
          ${state.reviewDemoteClick ? '点击: 打回' : '点击: 记得'}
        </button>
        <button class="btn btn-sm" id="btn-review-reset">重置</button>
        <span class="help-tip" title="${isZh2En ? '看中文回顾英文：左键或 Space 记为通过（累计 ✓ 次数）；右键或 S 键打回待攻克；悬停或按 V 键核对英文与锚点；M 键切换中英' : '看英文回顾中文：左键或 Space 记为通过（累计 ✓ 次数）；右键或 S 键打回待攻克；悬停或按 V 键看释义与锚点；M 键切换中英'}">?</span>
        <div class="spacer"></div>
        <button class="btn btn-sm" data-open-story="" title="查看或粘贴情景记忆故事">📖 故事${scopeStories.length ? ` (${scopeStories.length})` : ''}</button>
      </div>
    `;

    if (list.length === 0) {
      const stage3Total = getScopedWords().filter((w) => {
        const r = getWordRec(w.id);
        return r.stage3_passed === true && r.status === 'mastered';
      }).length;
      const doneMsg = fullPoolCount > 0
        ? `本轮 ${fullPoolCount} 词已复习完成！可以立刻切换方向反向复测，或打乱再来一轮。`
        : (state.reviewSource === 'stage3_due' && stage3Total > 0
          ? `本范围二筛词汇（${stage3Total} 词）均已巩固满 3 次且未到隔天复习窗口，可切换查看全集或反向复测。`
          : `当前复习池为空，可切换上方复习来源或先在 ③ 二筛通过词汇。`);
      html += `
        <div class="empty-state">
          <div>${doneMsg}</div>
          <div class="empty-actions">
            ${(fullPoolCount > 0 || (state.reviewSource === 'stage3_due' && stage3Total > 0)) ? `
              <button class="btn btn-sm btn-primary" id="btn-review-flip-round">🔄 切为「${isZh2En ? '英→中' : '中→英'}」反向复测</button>
            ` : ''}
            ${fullPoolCount > 0 ? `
              <button class="btn btn-sm" id="btn-review-replay-round">🎲 重置并乱序再刷一轮</button>
            ` : ''}
            ${state.reviewSource === 'stage3_due' && stage3Total > 0 && fullPoolCount === 0 ? `
              <button class="btn btn-sm" id="btn-review-all-stage3">📋 查看二筛全部词 (${stage3Total})</button>
            ` : ''}
            <button class="btn btn-sm" id="btn-review-to-listen">🎧 送去「⑤ 听词」盲听</button>
          </div>
        </div>
      `;
      main.innerHTML = html;

      document.getElementById('btn-review-flip-round')?.addEventListener('click', () => {
        if (state.reviewSource === 'stage3_due' && fullPoolCount === 0 && stage3Total > 0) {
          state.reviewSource = 'stage3';
        }
        state.reviewDirection = isZh2En ? 'en2zh' : 'zh2en';
        state.reviewClearedIds.clear();
        scheduleSave();
        renderReviewStage(main);
      });
      document.getElementById('btn-review-replay-round')?.addEventListener('click', () => {
        state.reviewClearedIds.clear();
        state.reviewOrder = shuffleArray(getReviewPool({ includeCleared: true }).map((w) => w.id));
        renderReviewStage(main);
      });
      document.getElementById('btn-review-all-stage3')?.addEventListener('click', () => {
        state.reviewSource = 'stage3';
        state.reviewOrder = null;
        state.reviewClearedIds.clear();
        renderReviewStage(main);
      });
      document.getElementById('btn-review-to-listen')?.addEventListener('click', () => {
        if (state.reviewSource === 'story') state.listen.scope = 'story';
        else if (state.reviewSource === 'hard') state.listen.scope = 'hard';
        else if (state.reviewSource === 'stage3_due' || state.reviewSource === 'stage3') state.listen.scope = 'stage3';
        else state.listen.scope = 'unit_all';
        switchStage('listen');
      });
    } else {
      html += `<div class="word-grid density-${state.density}${isZh2En ? ' mode-zh2en' : ''}">${list.map((w) => createWordChipHtml(w, { highlightHard: true, displayMode: state.reviewDirection, showReviewCount: true, showStoryBadge: true })).join('')}</div>`;
      main.innerHTML = html;
    }

    document.querySelectorAll('#review-dir-switch .dir-tab').forEach((btn) => {
      btn.onclick = () => {
        const nextDir = btn.dataset.dir;
        if (nextDir === state.reviewDirection) return;
        state.reviewDirection = nextDir;
        state.reviewClearedIds.clear();
        hidePeekTooltip();
        scheduleSave();
        renderReviewStage(main);
      };
    });
    document.getElementById('review-source').onchange = (e) => {
      state.reviewSource = e.target.value;
      if (state.reviewSource !== 'story') state.reviewFilterStoryId = null;
      state.reviewOrder = null;
      state.reviewClearedIds.clear();
      renderReviewStage(main);
    };
    document.getElementById('btn-review-shuffle').onclick = () => {
      state.reviewOrder = shuffleArray(list.map((w) => w.id));
      renderReviewStage(main);
    };
    document.getElementById('btn-review-mode').onclick = () => {
      state.reviewDemoteClick = !state.reviewDemoteClick;
      renderReviewStage(main);
    };
    document.getElementById('btn-review-reset').onclick = () => {
      state.reviewClearedIds.clear();
      renderReviewStage(main);
    };

    const demoteWord = (wid, chip) => {
      hidePeekTooltip();
      advanceCursorFromChip(chip);
      const rec = getWordRec(wid);
      updateWordRec(wid, {
        status: 'learning',
        stage3_passed: false,
        triage_known: false,
        review_fail_count: (rec.review_fail_count || 0) + 1
      });
      chip.classList.add('is-demoted');
      setTimeout(() => {
        state.reviewClearedIds.add(wid);
        chip.classList.add('vanishing');
        setTimeout(() => {
          chip.remove();
          if (getReviewPool().length === 0) renderReviewStage(main);
        }, 145);
      }, 240);
      showToast('已打回“待攻克”池');
    };

    const passWord = (wid, chip) => {
      hidePeekTooltip();
      advanceCursorFromChip(chip);
      const rec = getWordRec(wid);
      updateWordRec(wid, {
        review_pass_count: (rec.review_pass_count || 0) + 1,
        last_reviewed_at: new Date().toISOString()
      });
      state.reviewClearedIds.add(wid);
      chip.classList.add('vanishing');
      setTimeout(() => {
        chip.remove();
        if (getReviewPool().length === 0) renderReviewStage(main);
      }, 145);
    };

    setChipHandlers(
      (wid, chip) => (state.reviewDemoteClick ? demoteWord(wid, chip) : passWord(wid, chip)),
      (wid, chip) => demoteWord(wid, chip),
      true
    );
  }

  // --- Stage 5: Rapid Audio Listening Mode ---
  function stopListenSession() {
    clearTimeout(state.listen.timerHandle);
    clearInterval(state.listen.tickHandle);
    stopAudio();
    state.listen.running = false;
    state.listen.paused = false;
    state.listen.awaitingAction = false;
    state.listen.flashingMiss = false;
  }

  function buildListenQueue() {
    const scoped = getScopedWords();
    const sc = state.listen.scope;
    let pool = [];
    if (sc === 'learning') pool = scoped.filter(isLearningPool);
    else if (sc === 'unit_all') pool = [...scoped];
    else if (sc === 'stage3') pool = scoped.filter((w) => getWordRec(w.id).stage3_passed === true);
    else if (sc === 'hard') pool = scoped.filter((w) => {
      const r = getWordRec(w.id);
      return r.starred || (r.audio_miss_count || 0) > 0;
    });
    else if (sc === 'story') {
      const storyWordSet = getActiveStoryWordSet();
      pool = scoped.filter((w) => storyWordSet.has((w.cleanWord || w.word).toLowerCase()));
    }
    else if (sc === 'random50') pool = shuffleArray(scoped).slice(0, 50);
    return shuffleArray(pool);
  }

  async function runCurrentListenWord() {
    const L = state.listen;
    clearTimeout(L.timerHandle);
    clearInterval(L.tickHandle);
    L.awaitingAction = false;
    L.flashingMiss = false;

    if (!L.running || L.paused) return;
    if (L.index >= L.queue.length) {
      L.running = false;
      renderListenStage(document.getElementById('main-area'));
      showToast(`本轮听词结束！听出 ${L.passed.length} / 未听出 ${L.missed.length}`);
      return;
    }

    const w = L.queue[L.index];
    prefetchUpcomingAudio(L.queue, L.index + 1, 3, L.voice);
    updateListenLiveView(w, 1.0, '正在播放发音...');
    await playTextAudio(w.cleanWord || w.word, L.voice, L.repeat);

    if (!L.running || L.paused) return;
    // Start reaction countdown window
    L.awaitingAction = true;
    L.countdownStart = performance.now();
    const durationMs = L.intervalSec * 1000;

    L.tickHandle = setInterval(() => {
      if (!L.running || L.paused || !L.awaitingAction) return;
      const elapsed = performance.now() - L.countdownStart;
      const ratio = Math.max(0, 1 - elapsed / durationMs);
      const fill = document.getElementById('listen-progress-fill');
      const statusTxt = document.getElementById('listen-status-txt');
      if (fill) {
        fill.style.width = `${(ratio * 100).toFixed(1)}%`;
        fill.classList.toggle('urgent', ratio < 0.35);
      }
      if (statusTxt) {
        statusTxt.textContent = `反应窗口 ${(Math.max(0, durationMs - elapsed) / 1000).toFixed(1)}s · 听出请按空格 [Space]`;
      }
    }, 60);

    L.timerHandle = setTimeout(() => {
      handleListenMiss();
    }, durationMs);
  }

  function handleListenPass() {
    const L = state.listen;
    if (!L.running || L.paused || L.flashingMiss || L.index >= L.queue.length) return;
    clearTimeout(L.timerHandle);
    clearInterval(L.tickHandle);
    stopAudio();
    L.awaitingAction = false;

    const w = L.queue[L.index];
    playFeedbackTone('pass');
    const rec = getWordRec(w.id);
    updateWordRec(w.id, { audio_pass_count: (rec.audio_pass_count || 0) + 1 }, false);
    if (!L.passed.some((x) => x.id === w.id)) L.passed.unshift(w);

    const wordEl = document.getElementById('listen-word-el');
    const subEl = document.getElementById('listen-sub-el');
    if (wordEl) {
      wordEl.style.color = 'var(--accent)';
      wordEl.textContent = `✓ ${w.word}`;
    }
    if (subEl) subEl.textContent = (w.zhMeaning || w.enMeaning || '').split('\n')[0];

    L.index++;
    renderListenTrays();
    L.timerHandle = setTimeout(() => runCurrentListenWord(), 350);
  }

  function handleListenMiss() {
    const L = state.listen;
    if (!L.running || L.paused || L.flashingMiss || L.index >= L.queue.length) return;
    clearTimeout(L.timerHandle);
    clearInterval(L.tickHandle);
    stopAudio();
    L.awaitingAction = false;
    L.flashingMiss = true;

    const w = L.queue[L.index];
    playFeedbackTone('miss');
    if (L.replayOnMiss) playTextAudio(w.cleanWord || w.word, L.voice, 1);
    const rec = getWordRec(w.id);
    updateWordRec(w.id, { audio_miss_count: (rec.audio_miss_count || 0) + 1 }, false);
    if (!L.missed.some((x) => x.id === w.id)) L.missed.unshift(w);

    const wordEl = document.getElementById('listen-word-el');
    const subEl = document.getElementById('listen-sub-el');
    if (wordEl) {
      wordEl.style.color = 'var(--danger)';
      wordEl.textContent = `✕ ${w.word}`;
    }
    if (subEl) subEl.textContent = (w.zhMeaning || w.enMeaning || '暂无释义').split('\n')[0];

    L.index++;
    renderListenTrays();
    const waitMs = Math.max(L.flashOnMiss ? 1200 : 120, L.replayOnMiss ? 1350 : 0);
    L.timerHandle = setTimeout(() => runCurrentListenWord(), waitMs);
  }

  function updateListenLiveView(w, ratio, statusMsg) {
    const wordEl = document.getElementById('listen-word-el');
    const subEl = document.getElementById('listen-sub-el');
    const fill = document.getElementById('listen-progress-fill');
    const statusTxt = document.getElementById('listen-status-txt');
    const idxEl = document.getElementById('listen-idx-txt');

    if (wordEl) {
      wordEl.style.color = 'var(--text)';
      wordEl.textContent = state.listen.blind ? '🔊 盲听中...' : w.word;
    }
    if (subEl) {
      subEl.textContent = state.listen.blind ? '听出词义后立刻按下空格 [Space]' : ((w.phonetics && w.phonetics.us) ? `/${w.phonetics.us}/` : '');
    }
    if (fill) {
      fill.style.width = `${ratio * 100}%`;
      fill.classList.remove('urgent');
    }
    if (statusTxt) statusTxt.textContent = statusMsg;
    if (idxEl) idxEl.textContent = `进度 ${state.listen.index + 1} / ${state.listen.queue.length}`;
  }

  function findWordById(wid) {
    const book = getActiveBook();
    if (!book) return null;
    if (book.wordMap) return book.wordMap.get(wid) || null;
    return (book.words || []).find((w) => w.id === wid) || null;
  }

  let peekRafId = 0;
  let peekPendingPos = { x: 0, y: 0 };

  function showPeekTooltip(wid, ev) {
    const w = findWordById(wid);
    if (!w) return;
    const tip = document.getElementById('peek-tooltip');
    const isZh2EnAnswer =
      (state.activeStage === 'sieve2' && state.sieve2Direction === 'zh2en') ||
      (state.activeStage === 'review' && state.reviewDirection === 'zh2en');
    tip.classList.toggle('is-zh2en-answer', isZh2EnAnswer);
    document.getElementById('peek-word').textContent = w.word;
    const p = w.phonetics || {};
    document.getElementById('peek-ipa').textContent = [p.uk ? `UK /${p.uk}/` : '', p.us ? `US /${p.us}/` : '', p.respell || ''].filter(Boolean).join(' · ');
    document.getElementById('peek-zh').textContent = w.zhMeaning || w.enMeaning || '暂无释义';
    const rootEl = document.getElementById('peek-root');
    if (rootEl) {
      const storyInfo = getStoryEntryForWord(w.cleanWord || w.word);
      const parts = [];
      if (w.rootBreakdown) parts.push('🧩 ' + w.rootBreakdown);
      if (storyInfo && storyInfo.anchor) parts.push('📖 ' + stripSimpleMd(storyInfo.anchor));
      if (parts.length) {
        rootEl.textContent = parts.join('\n');
        rootEl.style.display = 'block';
      } else {
        rootEl.style.display = 'none';
      }
    }
    tip.classList.add('show');
    movePeekTooltip(ev);
  }

  function movePeekTooltip(ev) {
    const tip = document.getElementById('peek-tooltip');
    if (!tip.classList.contains('show')) return;
    peekPendingPos.x = Math.max(8, Math.min(window.innerWidth - 315, ev.clientX + 14));
    peekPendingPos.y = Math.max(8, Math.min(window.innerHeight - 160, ev.clientY + 14));
    if (!peekRafId) {
      peekRafId = requestAnimationFrame(() => {
        peekRafId = 0;
        tip.style.left = peekPendingPos.x + 'px';
        tip.style.top = peekPendingPos.y + 'px';
      });
    }
  }

  function hidePeekTooltip() {
    document.getElementById('peek-tooltip').classList.remove('show');
  }

  function getVisibleChips() {
    return Array.from(document.querySelectorAll('#main-area .word-chip:not(.vanishing)'));
  }

  function applyCursorToChip(next) {
    document.querySelectorAll('#main-area .word-chip.is-cursor').forEach((el) => el.classList.remove('is-cursor'));
    if (next) {
      next.classList.add('is-cursor');
      state.cursorWid = next.dataset.wid;
      next.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    } else {
      state.cursorWid = null;
    }
    return next;
  }

  function advanceCursorFromChip(chip) {
    if (!chip) return null;
    const chips = getVisibleChips();
    const idx = chips.indexOf(chip);
    const next = idx >= 0 ? (chips[idx + 1] || chips[idx - 1] || null) : (chips[0] || null);
    return applyCursorToChip(next);
  }

  function moveSieveCursor(dir) {
    const chips = getVisibleChips();
    if (!chips.length) return null;
    const curIdx = state.cursorWid ? chips.findIndex((c) => c.dataset.wid === state.cursorWid) : -1;
    if (curIdx < 0) return applyCursorToChip(chips[0]);

    let next = null;
    if (dir === 'left') {
      next = chips[Math.max(0, curIdx - 1)];
    } else if (dir === 'right') {
      next = chips[Math.min(chips.length - 1, curIdx + 1)];
    } else {
      const curRect = chips[curIdx].getBoundingClientRect();
      const curCx = curRect.left + curRect.width / 2;
      const curCy = curRect.top + curRect.height / 2;
      const cands = [];
      for (const c of chips) {
        if (c === chips[curIdx]) continue;
        const r = c.getBoundingClientRect();
        const dy = dir === 'down' ? (r.top + r.height / 2 - curCy) : (curCy - (r.top + r.height / 2));
        if (dy > 8) {
          cands.push({ chip: c, dy, dx: Math.abs(r.left + r.width / 2 - curCx) });
        }
      }
      if (cands.length) {
        cands.sort((a, b) => a.dy - b.dy);
        const minDy = cands[0].dy;
        const sameRow = cands.filter((c) => c.dy <= minDy + 18);
        sameRow.sort((a, b) => a.dx - b.dx);
        next = sameRow[0].chip;
      } else {
        next = dir === 'down' ? chips[Math.min(chips.length - 1, curIdx + 1)] : chips[Math.max(0, curIdx - 1)];
      }
    }
    return applyCursorToChip(next);
  }

  function attachCardAndSieveDelegation(rootEl) {
    if (!rootEl) return;

    rootEl.addEventListener('click', (e) => {
      const speakBtn = e.target.closest('[data-speak]');
      if (speakBtn) {
        e.stopPropagation();
        playTextAudio(speakBtn.dataset.speak, state.listen.voice, 1);
        return;
      }

      const starBtn = e.target.closest('[data-toggle-star]');
      if (starBtn) {
        e.stopPropagation();
        const wid = starBtn.dataset.toggleStar;
        const rec = getWordRec(wid);
        const next = !rec.starred;
        updateWordRec(wid, { starred: next });
        starBtn.classList.toggle('btn-warn', next);
        starBtn.textContent = next ? '★ 已星标' : '☆ 星标';
        return;
      }

      const masterBtn = e.target.closest('[data-mark-mastered]');
      if (masterBtn) {
        e.stopPropagation();
        const wid = masterBtn.dataset.markMastered;
        const rec = getWordRec(wid);
        const nextStatus = rec.status === 'mastered' ? 'learning' : 'mastered';
        updateWordRec(wid, { status: nextStatus });
        masterBtn.classList.toggle('btn-primary', nextStatus === 'mastered');
        masterBtn.textContent = nextStatus === 'mastered' ? '✓ 已掌握' : '标记掌握';
        return;
      }

      const jumpBtn = e.target.closest('[data-jump-word]');
      if (jumpBtn) {
        e.stopPropagation();
        const targetWord = jumpBtn.dataset.jumpWord.trim().toLowerCase();
        const book = getActiveBook();
        const match = book && book.wordLowerMap ? book.wordLowerMap.get(targetWord) : null;
        if (match) {
          openDetailModal(match.id);
        } else {
          showToast(`当前词书未收录: ${jumpBtn.dataset.jumpWord}`);
        }
        return;
      }

      const replayBtn = e.target.closest('[data-replay]');
      if (replayBtn) {
        e.stopPropagation();
        playTextAudio(replayBtn.dataset.replay, state.listen.voice, 1);
        return;
      }

      const detailBtn = e.target.closest('[data-open-detail]');
      if (detailBtn) {
        e.stopPropagation();
        openDetailModal(detailBtn.dataset.openDetail);
        return;
      }

      const storyBtn = e.target.closest('[data-open-story]');
      if (storyBtn) {
        e.stopPropagation();
        openStoryModal(storyBtn.dataset.openStory || null, storyBtn.dataset.storyFocus || '');
        return;
      }

      const maskedBody = e.target.closest('.study-body.is-masked');
      if (maskedBody && !e.target.closest('textarea, button, .cognate-chip')) {
        maskedBody.classList.remove('is-masked');
        return;
      }

      const chip = e.target.closest('.word-chip');
      if (chip) {
        e.preventDefault();
        const wid = chip.dataset.wid;
        if (e.altKey) {
          if (currentChipHandlers.right) currentChipHandlers.right(wid, chip);
        } else {
          if (currentChipHandlers.left) currentChipHandlers.left(wid, chip);
        }
      }
    });

    rootEl.addEventListener('contextmenu', (e) => {
      const chip = e.target.closest('.word-chip');
      if (!chip) return;
      e.preventDefault();
      if (currentChipHandlers.right) currentChipHandlers.right(chip.dataset.wid, chip);
    });

    rootEl.addEventListener('dblclick', (e) => {
      const chip = e.target.closest('.word-chip');
      if (!chip) return;
      e.preventDefault();
      openDetailModal(chip.dataset.wid);
    });

    rootEl.addEventListener('mouseover', (e) => {
      const chip = e.target.closest('.word-chip');
      if (!chip || !currentChipHandlers.peek) return;
      if (e.relatedTarget && chip.contains(e.relatedTarget)) return;
      showPeekTooltip(chip.dataset.wid, e);
    });

    rootEl.addEventListener('mouseout', (e) => {
      const chip = e.target.closest('.word-chip');
      if (!chip || !currentChipHandlers.peek) return;
      if (e.relatedTarget && chip.contains(e.relatedTarget)) return;
      hidePeekTooltip();
    });

    rootEl.addEventListener('mousemove', (e) => {
      const chip = e.target.closest('.word-chip');
      if (!chip || !currentChipHandlers.peek) return;
      movePeekTooltip(e);
    });

    rootEl.addEventListener('input', (e) => {
      const ta = e.target.closest('[data-mnemonic-wid]');
      if (!ta) return;
      updateWordRec(ta.dataset.mnemonicWid, { mnemonic: ta.value }, false);
    });
  }

  function openDetailModal(wid) {
    const w = findWordById(wid);
    if (!w) return;
    const modal = document.getElementById('detail-modal');
    const body = document.getElementById('detail-modal-body');
    body.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span class="hint-text">${escHtml(w.unit)} · ${escHtml(w.rootGroup || '')}</span>
        <button class="btn btn-sm" id="btn-close-modal">关闭 (Esc)</button>
      </div>
      ${renderWordDetailCardHtml(w, false)}
    `;
    modal.classList.add('show');
    document.getElementById('btn-close-modal').onclick = () => modal.classList.remove('show');
  }

  function switchStage(stage) {
    if (state.activeStage === 'listen' && stage !== 'listen') {
      stopListenSession();
    }
    state.activeStage = stage;
    scheduleSave();
    renderStageNav();
    renderStage();
  }

  function renderAll() {
    renderBookTabs();
    renderUnitSelector();
    renderHeaderStats();
    renderStageNav();
    renderStage();
  }

  // 10. Global Events & Shortcuts
  attachCardAndSieveDelegation(document.getElementById('main-area'));
  attachCardAndSieveDelegation(document.getElementById('detail-modal-body'));
  attachCardAndSieveDelegation(document.getElementById('story-modal-body'));

  document.getElementById('stage-nav').querySelectorAll('.stage-btn').forEach((btn) => {
    btn.onclick = () => switchStage(btn.dataset.stage);
  });

  document.getElementById('unit-select').onchange = (e) => {
    state.activeUnit = e.target.value;
    state.focusIndex = 0;
    state.sieve2Order = null;
    state.reviewFilterStoryId = null;
    state.reviewOrder = null;
    state.reviewClearedIds.clear();
    scheduleSave();
    renderHeaderStats();
    renderStage();
  };

  document.getElementById('search-input').addEventListener('input', (e) => {
    state.searchQuery = e.target.value;
    state.focusIndex = 0;
    renderHeaderStats();
    renderStage();
  });

  document.getElementById('btn-undo').onclick = performUndo;

  document.getElementById('btn-export-md').onclick = async () => {
    const book = getActiveBook();
    const scoped = getScopedWords();
    const exportList = scoped.filter((w) => isLearningPool(w) || getWordRec(w.id).starred);
    if (!exportList.length) {
      showToast('当前范围没有待攻克或已星标的单词');
      return;
    }
    const unitLabel = state.activeUnit === 'ALL' ? '全部单元' : state.activeUnit;
    const lines = [
      `# ${(book && book.title) || state.activeBookId} — ${unitLabel} 生词导出 (${exportList.length} 词)`,
      ''
    ];
    for (const w of exportList) {
      const rec = getWordRec(w.id);
      const p = w.phonetics || {};
      const ipa = [p.uk ? `UK /${p.uk}/` : '', p.us ? `US /${p.us}/` : ''].filter(Boolean).join(' ');
      const tags = [rec.starred ? '★星标' : '', w.pos || '', w.rootGroup || ''].filter(Boolean).join(' · ');
      lines.push(`### ${w.word}${ipa ? ` \`${ipa}\`` : ''}${tags ? ` (${tags})` : ''}`);
      if (w.zhMeaning) lines.push(`- **中文**：${w.zhMeaning.replace(/\n+/g, '；')}`);
      if (w.enMeaning) lines.push(`- **英文**：${w.enMeaning.replace(/\n+/g, ' ')}`);
      if (w.rootBreakdown) lines.push(`- **词根拆解**：${w.rootBreakdown}`);
      if (w.etymology) lines.push(`- **简明词源**：${w.etymology}`);
      if (w.contextExplanation) lines.push(`- **精讲/词源**：${w.contextExplanation.replace(/\n+/g, ' ')}`);
      if (rec.mnemonic) lines.push(`- **助记**：${rec.mnemonic.replace(/\n+/g, ' ')}`);
      lines.push('');
    }
    const md = lines.join('\n');
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(md);
      } else {
        throw new Error('no clipboard api');
      }
    } catch (_) {
      const ta = document.createElement('textarea');
      ta.value = md;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    showToast(`已复制 ${exportList.length} 个词的 Markdown 笔记到剪贴板`);
    document.getElementById('top-more-menu')?.removeAttribute('open');
  };

  document.getElementById('btn-theme').onclick = () => {
    const nextDark = !document.documentElement.classList.contains('dark');
    document.documentElement.classList.toggle('dark', nextDark);
    localStorage.setItem('vocab_sieve_theme', nextDark ? 'dark' : 'light');
    document.getElementById('top-more-menu')?.removeAttribute('open');
  };

  document.addEventListener('click', (e) => {
    document.querySelectorAll('details.top-more-menu[open], details.stage-pop-menu[open]').forEach((d) => {
      if (!d.contains(e.target)) d.removeAttribute('open');
    });
  });

  document.getElementById('detail-modal').addEventListener('click', (e) => {
    if (e.target.id === 'detail-modal') {
      e.target.classList.remove('show');
    }
  });

  document.getElementById('story-modal').addEventListener('click', (e) => {
    if (e.target.id === 'story-modal') {
      e.target.classList.remove('show');
    }
  });

  window.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) || '';
    const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !isTyping) {
      e.preventDefault();
      performUndo();
      return;
    }
    if (e.key === 'Escape') {
      const detailModal = document.getElementById('detail-modal');
      const storyModal = document.getElementById('story-modal');
      if (detailModal.classList.contains('show')) {
        detailModal.classList.remove('show');
      } else if (storyModal && storyModal.classList.contains('show')) {
        storyModal.classList.remove('show');
      }
      hidePeekTooltip();
      document.querySelectorAll('details.top-more-menu[open], details.stage-pop-menu[open]').forEach((d) => d.removeAttribute('open'));
      return;
    }
    if (isTyping) return;

    // Listening mode shortcuts
    if (state.activeStage === 'listen' && state.listen.running) {
      if (e.code === 'Space') {
        e.preventDefault();
        handleListenPass();
      } else if (e.key === 'Enter' || e.key === 'ArrowDown') {
        e.preventDefault();
        handleListenMiss();
      } else if (e.key.toLowerCase() === 'r') {
        e.preventDefault();
        const w = state.listen.queue[state.listen.index];
        if (w) playTextAudio(w.cleanWord || w.word, state.listen.voice, 1);
      } else if (e.key.toLowerCase() === 'p') {
        e.preventDefault();
        const pauseBtn = document.getElementById('btn-listen-pause');
        if (pauseBtn) pauseBtn.click();
      }
      return;
    }

    // Focus study card shortcuts
    if (state.activeStage === 'study' && state.studyMode === 'focus') {
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        document.getElementById('btn-focus-next')?.click();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        document.getElementById('btn-focus-prev')?.click();
      } else if (e.code === 'Space') {
        e.preventDefault();
        document.getElementById('btn-focus-reveal')?.click();
      } else if (e.key.toLowerCase() === 'p') {
        e.preventDefault();
        const card = document.querySelector('[data-speak]');
        if (card) card.click();
      }
      return;
    }

    // Keyboard speed sieve shortcuts for Stage 1 / Stage 3 / Stage 4
    const modalOpen =
      document.getElementById('detail-modal').classList.contains('show') ||
      document.getElementById('story-modal').classList.contains('show');
    if (!modalOpen && ['triage', 'sieve2', 'review'].includes(state.activeStage)) {
      const k = e.key.toLowerCase();
      if (e.key === 'ArrowLeft' || k === 'h') {
        e.preventDefault();
        moveSieveCursor('left');
      } else if (e.key === 'ArrowRight' || k === 'l') {
        e.preventDefault();
        moveSieveCursor('right');
      } else if (e.key === 'ArrowUp' || k === 'k') {
        e.preventDefault();
        moveSieveCursor('up');
      } else if (e.key === 'ArrowDown' || k === 'j') {
        e.preventDefault();
        moveSieveCursor('down');
      } else if (e.code === 'Space' || e.key === 'Enter') {
        e.preventDefault();
        let chip = state.cursorWid ? document.querySelector('#main-area .word-chip.is-cursor') : null;
        if (!chip) chip = moveSieveCursor('right');
        if (chip && currentChipHandlers.left) currentChipHandlers.left(chip.dataset.wid, chip);
      } else if (k === 's') {
        e.preventDefault();
        let chip = state.cursorWid ? document.querySelector('#main-area .word-chip.is-cursor') : null;
        if (!chip) chip = moveSieveCursor('right');
        if (chip && currentChipHandlers.right) currentChipHandlers.right(chip.dataset.wid, chip);
      } else if (k === 'v') {
        e.preventDefault();
        let chip = state.cursorWid ? document.querySelector('#main-area .word-chip.is-cursor') : null;
        if (!chip) chip = moveSieveCursor('right');
        if (chip) {
          const w = findWordById(chip.dataset.wid);
          if (w) {
            playTextAudio(w.cleanWord || w.word, state.listen.voice, 1);
            const r = chip.getBoundingClientRect();
            showPeekTooltip(w.id, { clientX: r.left, clientY: r.bottom });
          }
        }
      } else if (k === 'm' && (state.activeStage === 'sieve2' || state.activeStage === 'review')) {
        e.preventDefault();
        if (state.activeStage === 'sieve2') {
          state.sieve2Direction = state.sieve2Direction === 'zh2en' ? 'en2zh' : 'zh2en';
          hidePeekTooltip();
          scheduleSave();
          renderSieve2Stage(document.getElementById('main-area'));
          showToast(state.sieve2Direction === 'zh2en' ? '已切换：看中文回顾英文' : '已切换：看英文回顾中文');
        } else {
          state.reviewDirection = state.reviewDirection === 'zh2en' ? 'en2zh' : 'zh2en';
          state.reviewClearedIds.clear();
          hidePeekTooltip();
          scheduleSave();
          renderReviewStage(document.getElementById('main-area'));
          showToast(state.reviewDirection === 'zh2en' ? '复习已切换：看中文回顾英文' : '复习已切换：看英文回顾中文');
        }
      }
    }
  });

  // 11. Bootstrap
  (async function init() {
    try {
      rebuildStoryIndex();
      if (!state.stories || !Array.isArray(state.stories.stories) || !state.stories.stories.length) {
        try {
          state.stories = await apiFetch('/api/stories');
          rebuildStoryIndex();
        } catch (_) {}
      }
      if (!state.manifest.books || !state.manifest.books.length) {
        state.manifest = await apiFetch('/api/manifest');
      }
      if (!state.manifest.books.some((b) => b.id === state.activeBookId) && state.manifest.books.length) {
        state.activeBookId = state.manifest.books[0].id;
      }
      await ensureBookLoaded(state.activeBookId);
      renderAll();
    } catch (err) {
      document.getElementById('main-area').innerHTML = `<div class="empty-state">加载失败: ${escHtml(err.message)}</div>`;
    }
  })();
})();
</script>
</body>
</html>
